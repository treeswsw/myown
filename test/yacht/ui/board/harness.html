<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yacht board harness</title>
<link rel="stylesheet" href="/client/src/yacht/ui/board.css">
<style>
  html, body { margin: 0; height: 100%; background: #38241a; overflow: hidden; }
  /* 점수표 자리(왼쪽)와 상단 줄(위 54px)을 비워 둔 판 영역 */
  #host { position: fixed; left: var(--sheet, 400px); right: 0; top: 54px; bottom: 0; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
import { createBoard } from '/client/src/yacht/ui/board.js';
import * as F from '/test/yacht/ui/board/fixtures.js';

const q = new URLSearchParams(location.search);
document.documentElement.style.setProperty('--sheet', (q.get('sheet') || '400') + 'px');
const h = { sent: [], busy: [], F };
h.board = createBoard({ host: document.getElementById('host'), stage: null,
  send: (m) => h.sent.push(m), getFace: () => null, onBusy: (b) => h.busy.push(b) });
h.update = (s) => h.board.update(s);
h.event = (e) => h.board.handleEvent(e);
h.frame = (dt = 0.1) => h.board.frame(dt);
let prev = performance.now();
(function loop(now) { h.board.frame(Math.min(0.1, (now - prev) / 1000)); prev = now; requestAnimationFrame(loop); })(prev);
window.h = h;
window.__ready = true;
</script>
</body>
</html>
