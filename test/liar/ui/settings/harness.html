<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>settings harness</title>
<link rel="stylesheet" href="/client/src/liar/ui/settings.css">
<style>
  html, body { margin: 0; height: 100%; background: #070608; color: #efe6d8; overflow: hidden; font-family: sans-serif; }
  #ui { position: fixed; inset: 16px; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="ui"></div>
<script type="module">
import { createSettings } from '/client/src/liar/ui/settings.js';
import { fixture, TIME_CHOICES, GOAL_CHOICES } from './fixtures.js';

const h = { sent: [], clock: 1_000_000, state: null, fixture };
const ctx = {
  root: document.getElementById('ui'), action: null, send: (m) => h.sent.push(m), now: () => h.clock, toast() {},
  anchor: () => null, faceOf: () => null, nogl: true, limits: { say: 80, chat: 80, guess: 30 },
};
h.mod = createSettings(ctx, { timeChoices: TIME_CHOICES, goalChoices: GOAL_CHOICES });
ctx.root.appendChild(h.mod.el);   // 붙이는 일은 시험 페이지가 한다
h.set = (name, n = 8, over = {}) => { h.state = name === null ? null : fixture(name, n, over); h.mod.update(h.state); };
window.h = h;
</script>
</body>
</html>
