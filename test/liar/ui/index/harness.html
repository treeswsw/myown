<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>index harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #070608; overflow: hidden; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="ui"></div>
<script type="module">
import { mount } from '/client/src/liar/index.js';
import { make } from '/test/liar/ui/index/fixtures.js';
import { profile } from '/client/src/ui/kit/avatar.js';

// 소리 호출을 세는 가짜 AudioContext(어떤 소리가 몇 번 났는지만 본다)
const plays = [];
const chain = () => new Proxy(function () {}, {
  get: (t, k) => { if (k === 'then') return undefined; if (typeof k === 'string' && /^create/.test(k)) return (...a) => { plays.push(k); return chain(); }; return chain(); },
  set: () => true,
  apply: () => chain(),
});
const audioCtx = chain();
const sound = { isMuted: () => false, context: () => audioCtx, output: () => chain(), unlock() {} };

const h = { sent: [], locks: [], plays, make, errors: [] };
const calls = [];
const fakeScene = () => ({ scene: {}, camera: {}, calls, setPlayers() {}, setFace() {}, setView() {}, resize() {}, frame() {}, dispose() {}, screenPos: () => null,
  setVotes: (v) => calls.push(['votes', v]), setJudge: (j) => calls.push(['judge', j]) });
const stage = { nogl: true, use() {} };
const faces = { get: () => ({ avatar: null, look: null }), onChange: () => () => {} };
const clock = { now: () => Date.now(), sync() {}, left: () => 0 };
const ctx = {
  root: document.getElementById('ui'), ui: document.getElementById('ui'), stage, send: (m) => h.sent.push(m), me: () => null,
  faces, clock, sound, profile, toast: () => {}, toWait: () => h.sent.push({ toWait: true }),
};
h.liar = mount(ctx, { sceneFactory: new URLSearchParams(location.search).has('fake') ? fakeScene : undefined });
h.calls = calls;
// 틀이 하는 일을 흉내: 상태를 주고, 채팅 칸 잠금(chatRule.lock)을 기록한다
h.apply = (s) => {
  h.liar.room(s);
  if (s) { const l = h.liar.chatRule.lock(s); h.locks.push([l.locked, l.hint]); }
};
h.chatMsg = (text) => h.liar.chatRule.route(text);
window.h = h;
window.__ready = true;
</script>
</body>
</html>
