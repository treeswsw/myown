<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이모티콘 패널 데모</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="./src/style.css">
<style>
#bg{position:fixed;inset:0;background:#000 url(../design/holdem-default.jpg) center/100% 100% no-repeat}
#log{position:fixed;right:8px;bottom:8px;z-index:60;max-width:46vw;max-height:30vh;overflow:auto;margin:0;padding:6px 8px;font:11px/1.4 monospace;background:rgba(0,0,0,.7);pointer-events:none}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ui"></div>
<pre id="log"></pre>
<script type="module">
// ?state=emote|sound|sound-edit|photo|playing  (&host, &fail: server never answers)  &t=<ms> freezes the floating photo / sound label at that moment of its life
import { createEmotePanel } from './src/ui/emotePanel.js';
import { updateScale } from './src/ui/dom.js';
import { createHud } from './src/ui/hud.js';

const q = new URLSearchParams(location.search);
const state = q.get('state') || 'emote';
const t = q.get('t');
updateScale();
// pin tops (screen px at 1280x720) of the players in the reference mockup
const TOPS = { 지우: [243, 106], 서연: [507, 28], 태호: [729, 8], 하린: [1152, 254], 민수: [448, 515] };
const getAnchor = (id) => (TOPS[id] ? { x: TOPS[id][0] / 1280 * innerWidth, y: TOPS[id][1] / 720 * innerHeight } : null);
const log = document.getElementById('log');
const say = (...a) => { console.log(...a); log.textContent += a.map((x) => (typeof x === 'string' && x.length > 60 ? `${x.slice(0, 30)}…(${x.length})` : JSON.stringify(x))).join(' ') + '\n'; };
const panel = window.panel = createEmotePanel({
  onEmote: (i) => say('emote', i),
  onPhoto: (d) => { say('photo', d); window.lastPhoto = d; panel.showPhoto('민수', d); },
  onSoundAdd: (s) => { say('sndAdd', s); window.lastAdd = s; if (!q.has('fail')) panel.addRoomSound({ ...s, by: '민수' }); },
  onSound: (sid) => { say('snd', sid); panel.playSound('민수', sid); },
  onSoundDelete: (sid) => { say('sndDel', sid); if (!q.has('fail')) panel.removeRoomSound(sid); },
  onSoundRename: (sid, name) => { say('sndRename', sid, name); if (!q.has('fail')) panel.renameRoomSound(sid, name); },
  getSelf: () => '민수',
  getName: (id) => id,
  isHost: () => q.has('host'),
  getAnchor,
});
const ui = document.getElementById('ui');
// same wrapper the HUD uses: a scaled .hpanel under the top-left icon row
const hpanel = document.createElement('div');
hpanel.className = 'hpanel';
hpanel.append(panel.el);
ui.append(hpanel);
addEventListener('resize', () => { updateScale(); panel.update(); });

const photo = (c1, c2) => {
  const c = document.createElement('canvas');
  c.width = 200; c.height = 150;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 200, 150);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.fillRect(0, 0, 200, 150);
  g.fillStyle = '#fff'; g.font = '700 64px sans-serif'; g.fillText('😀', 70, 95);
  return c.toDataURL('image/jpeg', 0.8);
};
const freeze = () => {
  if (t == null) return;
  requestAnimationFrame(() => { for (const a of document.getAnimations()) { a.pause(); a.currentTime = +t; } });
};

const WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';
if (state.startsWith('sound')) {
  document.querySelectorAll('.ep-tab')[1].click();
  panel.setRoomSounds([['m1abcdef', '서연', '박수갈채'], ['m2abcdef', '태호', '어이쿠야'], ['m3abcdef', '민수', '내사운드'], ['m4abcdef', '하린', '긴이름여덟글자']].map(([sid, by, name]) => ({ sid, by, name, data: WAV })));
  if (state === 'sound-edit') document.querySelector('.ep-edit').click();
}
if (state === 'photo' || state === 'playing') {
  panel.showPhoto('서연', photo('#e8483a', '#4f8fe8'));
  panel.showPhoto('하린', photo('#3ecf5a', '#e9a53a'));
}
if (state === 'playing') {
  panel.playSound('지우', 'builtin:clap');
  panel.playSound('태호', 'builtin:boo');
  panel.playSound('민수', 'builtin:ding');
}
freeze();
</script>
</body>
</html>
