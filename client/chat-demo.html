<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>채팅 데모</title>
<link rel="stylesheet" href="./src/style.css">
<style>
#bg{position:fixed;inset:0;background:#000 url(../design/holdem-default.jpg) center/100% 100% no-repeat}
</style>
</head>
<body>
<div id="bg"></div>
<div id="ui"></div>
<script type="module">
// ?state=bubbles|replace|input|history|lobby|toast  &t=<ms> freezes every bubble at that moment of its life
import { createChat } from './src/ui/chat.js';
import { updateScale } from './src/ui/dom.js';
import { createLobby } from './src/ui/lobby.js';

const q = new URLSearchParams(location.search);
const state = q.get('state') || 'bubbles';
const t = q.get('t');
updateScale();
// pin tops (screen px at 1280x720) of the players in the reference mockup
const TOPS = { 지우: [243, 158], 서연: [507, 52], 태호: [729, 8], 하린: [1152, 280], 민수: [448, 545] };
const away = new Set(q.get('away')?.split(',') ?? []);
const getAnchor = (id) => (TOPS[id] && !away.has(id) ? { x: TOPS[id][0] / 1280 * innerWidth, y: TOPS[id][1] / 720 * innerHeight } : null);
const chat = createChat({ onSend: (text) => { console.log('send', text); chat.push({ id: '민수', name: '민수', text, ts: Date.now() }, { mine: true }); }, getAnchor });
const ui = document.getElementById('ui');
ui.append(chat.el, chat.button);
addEventListener('resize', () => { updateScale(); chat.update(); });

const now = Date.now();
const M = (id, text, ago = 0) => ({ id, name: id, text, ts: now - ago * 1000 });
const freeze = () => {
  if (t == null) return;
  for (const b of document.querySelectorAll('.chat-b, .chat-toast')) for (const a of b.getAnimations()) { a.pause(); a.currentTime = +t; }
};

chat.setLog([M('서연', '안녕하세요!', 300), M('태호', '이번 판 올인 갑니다 ㅋㅋ', 200), M('민수', '와 대박', 100), M('지우', '콜', 40)], '민수');
if (state === 'lobby') {
  const me = '민수';
  const names = ['민수', '서연', '태호'];
  const user = { id: me, name: me, bank: 12400, avatar: null, stats: { hands: 1, wins: 1, biggestWin: 1, refills: 0, bluffGames: 0, bluffWins: 0 } };
  const lobby = createLobby({ onLogin() {}, onAvatar() {}, onCreate() {}, onJoin() {}, onMode() {}, onStart() {}, onLeave() {}, onLogout() {} });
  document.body.append(lobby.el);
  document.getElementById('bg').style.filter = 'blur(18px) brightness(.5)';
  lobby.setUser(user);
  lobby.setRoom({ code: 'KMPT', mode: 'holdem', hostId: me, phase: 'lobby', you: me,
    players: names.map((name, i) => ({ id: name, name, avatar: null, seat: i, connected: true })) });
  chat.setMode('lobby');
  chat.setLog([M('서연', '안녕하세요!', 300), M('태호', '이번 판 올인 갑니다 ㅋㅋ 이 메시지는 아주 길어서 한 줄에 다 안 들어갑니다', 200), M('민수', '와 대박', 100)], me);
} else if (state === 'bubbles') {
  chat.push(M('민수', '안녕하세요!'), { mine: true });
  chat.push(M('서연', '이번 판 올인 갑니다 ㅋㅋ'));
  chat.push(M('태호', '이 메시지는 아주 길어서 두 줄까지만 보이고 나머지는 말줄임표로 잘려야 합니다 정말로 그래야 합니다 끝'));
  chat.push(M('하린', 'ㅎㅇ'));
  chat.push(M('지우', '콜'));
  freeze();
} else if (state === 'big') {
  chat.push(M('서연', '#올인 간다!!'));
  chat.push(M('태호', '#이 메시지는 아주 길어서 두 줄까지만 보이고 나머지는 말줄임표로 잘려야 합니다 정말 끝 끝 끝'));
  chat.push(M('민수', '#  콜 받아라'), { mine: true });
  chat.push(M('하린', '평범한 말풍선'));
  chat.push(M('지우', '#'));
  freeze();
} else if (state === 'bigreplace') {
  chat.push(M('서연', '#첫 번째 강조'));
  chat.push(M('민수', '#또 강조'), { mine: true });
  setTimeout(() => { chat.push(M('서연', '#두 번째 강조 메시지')); chat.push(M('민수', '그냥 일반 메시지')); freeze(); }, 1200);
} else if (state === 'replace') {
  chat.push(M('서연', '첫 번째 메시지'));
  chat.push(M('민수', '아직 내 차례 아님?'), { mine: true });
  setTimeout(() => { chat.push(M('서연', '두 번째 메시지가 바로 이어서 옵니다')); chat.push(M('민수', '기다려 줘')); freeze(); }, 1200);
} else if (state === 'toast') {
  away.add('서연'); away.add('태호');
  chat.push(M('서연', '화면 밖에서 보낸 메시지'));
  chat.push(M('태호', '이것도 토스트로 보여요'));
  chat.push(M('하린', '이쪽은 말풍선'));
  freeze();
} else {
  chat.open();
  if (state === 'input') { const i = document.querySelector('.chat-in'); i.value = '지금 입력하는 중인 메시지입니다'; i.dispatchEvent(new Event('input')); chat.push(M('서연', '입력창이 열려 있어도 말풍선은 떠요')); freeze(); }
  if (state === 'history') document.querySelector('.chat-log').click();
}
</script>
</body>
</html>
