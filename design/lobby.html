<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:-apple-system,"Helvetica Neue","Noto Sans KR",sans-serif;color:#fff;position:relative;background:#000}
.bg{position:absolute;inset:-40px;background:url('v5_1_홀덤_기본.png') center/cover;filter:blur(18px) brightness(.5)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px}
.glass{background:rgba(20,18,16,.55);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:34px;box-sizing:border-box;width:400px;height:500px;display:flex;flex-direction:column;gap:16px}
h1{font-family:"Bangers";font-weight:400;font-size:44px;letter-spacing:3px;margin:0;color:#ffc62a;-webkit-text-stroke:5px #17110a;paint-order:stroke fill;display:flex;align-items:center;gap:12px}
h1 i{width:52px;height:52px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;-webkit-text-stroke:0}
h2{font-family:"Black Han Sans";font-weight:400;font-size:22px;margin:0}
.sub{color:rgba(255,255,255,.65);font-size:14px;margin:-8px 0 4px}
.ph{width:112px;height:112px;border-radius:50%;border:3px dashed rgba(255,255,255,.55);align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:rgba(255,255,255,.75);gap:2px}
.ph b{font-size:34px;font-weight:300;line-height:1}
.in{height:54px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;padding:0 18px;font-size:17px;color:rgba(255,255,255,.5)}
.in.f{color:#fff;font-weight:600;letter-spacing:.3em;justify-content:center;font-size:22px}
.btn{height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;letter-spacing:.04em}
.btn.p{background:#fff;color:#111}.btn.s{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
.modes{display:flex;gap:12px}.mode{flex:1;border-radius:18px;padding:16px 14px;border:1.500px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
.mode.on{border-color:#ffc62a;background:rgba(255,198,42,.12)}.mode b{font-family:"Black Han Sans";font-weight:400;font-size:19px;display:block}.mode span{font-size:12.500px;color:rgba(255,255,255,.65)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.or{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.5);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.2)}
.grow{flex:1}
</style></head><body><div class="bg"></div><div class="wrap">
<div class="glass"><h1><i><svg viewBox="0 0 24 24" width="30" height="30" fill="#fff"><path d="M12 2C8 7 3 9.500 3 14a4.500 4.500 0 0 0 7.600 3.200L9.500 22h5l-1.100-4.800A4.500 4.500 0 0 0 21 14c0-4.500-5-7-9-12z"/></svg></i>CARD CLUB</h1>
<div class="sub">아이디를 입력하면 칩과 전적이 이어집니다</div>
<div class="ph"><b>+</b>프로필 사진</div><div class="grow"></div>
<div class="in">아이디</div><div class="btn p">입장</div></div>
<div class="glass"><h2>방 만들기</h2>
<div class="modes"><div class="mode on"><b><span class="dot" style="background:#c01c1c"></span>텍사스 홀덤</b><span>2~6명 · 블라인드 50/100</span></div><div class="mode"><b><span class="dot" style="background:#3a3f46"></span>블러핑 카드</b><span>2~4명 · 리볼버 벌칙</span></div></div>
<div class="btn p">방 만들기</div><div class="or">또는</div>
<h2>친구 방에 들어가기</h2><div class="in f">K M P T</div><div class="btn s">입장</div></div>
</div></body></html>
