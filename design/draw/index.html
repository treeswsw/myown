<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갱식마인드 — 정적 시안</title>
<!--
  정적 시안(가짜 데이터). 실제 코드가 아니다. 외부 파일 없음.
  화면 고르기: 왼쪽 아래 버튼, 또는 주소 ?s=lobby|room|pick|draw|guess|kb|reveal|final  (&shot=1 이면 버튼 숨김)
  크기: PC 1280x800, 휴대폰 가로 844x390 (높이 480px 이하이면 휴대폰 배치)
-->
<style>
:root{
  --ink:#fff;--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.32);
  --fill:rgba(255,255,255,.09);--fill2:rgba(255,255,255,.16);--hair:rgba(255,255,255,.12);
  --accent:#f2c444;--on-accent:#1c1608;--red:#ff453a;--green:#34c759;
  --panel:rgba(28,28,30,.62);--paper:#fffdf8;
  --pad:12px;--gap:12px;--bar:54px;--strip:52px;--under:56px;
  --pw:clamp(92px,8.5vw,112px);--palw:84px;--toolw:64px;
  --sl:0px;--sr:0px;
  --ch:min(calc(100dvh - var(--bar) - var(--pad)*2 - var(--strip) - var(--under) - 20px),
           calc((100vw - var(--pad)*2 - var(--pw)*2 - var(--palw) - var(--toolw) - var(--gap)*4)*.75));
  --cw:calc(var(--ch)*4/3);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0a09;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR","WenQuanYi Zen Hei",sans-serif;
  font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.bg{position:fixed;inset:0;background:
  radial-gradient(ellipse 70% 60% at 50% 42%,rgba(242,196,68,.10),transparent 70%),
  radial-gradient(ellipse at 50% 50%,#1d1813 0%,#0c0a09 75%)}

/* ---------- 시안 전용: 화면 고르기 ---------- */
.mk-nav{position:fixed;left:6px;bottom:6px;z-index:99;display:flex;gap:4px;flex-wrap:wrap;max-width:60vw;opacity:.85}
.mk-nav a{font-size:11px;padding:3px 7px;border-radius:8px;background:#000;color:#fff;text-decoration:none;border:1px solid #555}
.mk-nav a.on{background:var(--accent);color:#000}

/* ---------- 공통 조각 ---------- */
.dr-av{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.dr-btn{height:44px;border-radius:22px;padding:0 20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.dr-btn.primary{background:#fff;color:#000}
.dr-btn.tint{background:var(--fill)}
.dr-btn.gold{background:var(--accent);color:var(--on-accent)}
.dr-btn.danger{color:var(--red);background:rgba(255,69,58,.14)}
.dr-ic{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 2px #fff;display:flex;align-items:center;justify-content:center;flex:none}
.dr-ic svg{width:18px;height:18px}

/* ---------- 게임 화면 ---------- */
.dr-root{position:fixed;inset:0;display:flex;flex-direction:column}
.dr-bar{height:var(--bar);flex:none;display:flex;align-items:center;gap:10px;padding:0 calc(var(--pad) + var(--sr)) 0 calc(var(--pad) + var(--sl))}
.dr-brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
.dr-code{font-weight:700;color:var(--accent);letter-spacing:.12em}
.dr-sp{flex:1}
.dr-round{font-size:14px;color:var(--ink2);font-weight:600;white-space:nowrap}
.dr-round b{color:var(--ink);font-size:17px}
.dr-stage{flex:1;min-height:0;display:grid;justify-content:center;align-content:start;gap:0 var(--gap);
  grid-template-columns:var(--pw) var(--palw) var(--cw) var(--toolw) var(--pw);grid-template-rows:1fr;
  padding:0 calc(var(--pad) + var(--sr)) var(--pad) calc(var(--pad) + var(--sl))}
.dr-seats{display:flex;flex-direction:column;gap:10px;min-height:0;height:calc(var(--strip) + var(--ch) + var(--under) + 20px)}
.dr-seats.l{grid-column:1}.dr-seats.r{grid-column:5}
.dr-seat{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.dr-seat.off{opacity:.45}
.dr-who{display:flex;flex-direction:column;gap:9px;align-items:center;min-width:0;max-width:100%;text-align:center}
.dr-who>div{min-width:0;max-width:100%}
.dr-avw{position:relative;display:block}
.dr-seat .dr-av{width:72px;height:72px;font-size:30px;box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9),0 6px 16px rgba(0,0,0,.5)}
.dr-seat.turn .dr-av{box-shadow:inset 0 0 0 3px var(--accent),0 0 0 4px rgba(242,196,68,.3),0 0 22px rgba(242,196,68,.7)}
.dr-seat.hit .dr-av{box-shadow:inset 0 0 0 3px var(--green),0 0 0 4px rgba(52,199,89,.3),0 0 18px rgba(52,199,89,.6)}
.dr-av.dr-none{background:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);color:var(--ink3);font-size:12px;font-weight:500}
.dr-nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-sc{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.dr-sc b{color:var(--accent);font-size:15px;margin-right:1px}
.dr-tag{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 2px #0c0a09}
.dr-tag.host,.dr-tag.gone{background:#48484c;color:var(--ink)}
.dr-tag.ok{background:var(--green);color:#fff}
/* 말할 때 프로필이 통통, 맞혔을 때는 더 크게 */
.dr-av.talk{animation:dr-bounce .38s cubic-bezier(.3,.7,.4,1)}
.dr-av.cheer{animation:dr-cheer .75s cubic-bezier(.3,.7,.4,1)}
@keyframes dr-bounce{0%{transform:none}30%{transform:translateY(-12px) scale(.95,1.06)}62%{transform:translateY(0) scale(1.1,.9)}82%{transform:translateY(-3px) scale(.98,1.02)}100%{transform:none}}
@keyframes dr-cheer{0%{transform:none}22%{transform:translateY(-24px) scale(1.18) rotate(-10deg)}44%{transform:translateY(0) scale(1.14,.88) rotate(0)}62%{transform:translateY(-12px) scale(1.08) rotate(8deg)}82%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.dr-av.talk,.dr-av.cheer{animation:none}}
.dr-say{position:absolute;top:18px;z-index:4;width:max-content;max-width:170px;font-size:13.5px;line-height:1.3;padding:6px 10px;border-radius:13px;background:#fff;color:#111;opacity:.95;pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.45);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;animation:dr-pop .28s cubic-bezier(.3,1.6,.5,1) both}
.dr-say::before{content:'';position:absolute;top:9px;border:7px solid transparent}
.dr-say.out{opacity:0;transition:opacity .4s}
.dr-seats.l .dr-say{left:calc(100% + 10px);transform-origin:0 50%}
.dr-seats.l .dr-say::before{left:-12px;border-right-color:#fff}
.dr-seats.r .dr-say{right:calc(100% + 10px);transform-origin:100% 50%}
.dr-seats.r .dr-say::before{right:-12px;border-left-color:#fff}
.dr-say.ok{background:var(--green);color:#fff;font-weight:700}
.dr-seats.l .dr-say.ok::before{border-right-color:var(--green)}.dr-seats.r .dr-say.ok::before{border-left-color:var(--green)}
/* 그리는 사람 화면(PC·iPad): 말풍선을 프로필 위로 띄워 색·도구 칸을 가리지 않는다 */
@media (min-height:481px){
  .mine .dr-seats{padding-top:26px}
  .mine .dr-seats .dr-say{left:50%;right:auto;top:auto;bottom:calc(100% + 9px);max-width:118px;transform:translateX(-50%);transform-origin:50% 100%;animation-name:dr-pop-up}
  .mine .dr-seats .dr-say::before{top:auto;bottom:-12px;left:50%;right:auto;margin-left:-7px;border-color:transparent;border-top-color:#fff}
  .mine .dr-seats .dr-say.ok::before{border-color:transparent;border-top-color:var(--green)}
}
@keyframes dr-pop-up{from{transform:translateX(-50%) scale(.4);opacity:0}}
@keyframes dr-pop{from{transform:scale(.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.dr-say{animation:none}}
.mk-still .dr-say{animation:none}
.dr-plus{font-weight:800;color:var(--green);font-size:19px;line-height:1.1}

.dr-pal{grid-column:2;align-self:start;margin-top:calc(var(--strip) + 10px);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.dr-sw{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);position:relative}
.dr-sw.on{box-shadow:0 0 0 2px #0c0a09,0 0 0 4.5px #fff}
.dr-tools{grid-column:4;align-self:start;margin-top:calc(var(--strip) + 10px);display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:18px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.dr-tool{height:54px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink2);font-weight:600;white-space:nowrap}
.dr-tool svg{width:22px;height:22px;color:#fff}
.dr-tool.dim{opacity:.35}
.dr-tool.on{background:#fff;color:#000}.dr-tool.on svg{color:#000}
.dr-tools hr{border:0;height:1px;background:var(--hair);margin:2px 4px}
.dr-sizes{display:flex;gap:6px;align-items:center}
.dr-size{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--fill)}
.dr-size i{display:block;border-radius:50%;background:#fff}
.dr-size.on{background:#fff}.dr-size.on i{background:#000}
.dr-size svg{width:20px;height:20px}.dr-size.on svg{color:#000}
.dr-szpop{flex:1;min-width:0;height:48px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:24px;background:rgba(40,40,42,.95);box-shadow:inset 0 0 0 1px var(--hair)}
.dr-szprev{width:40px;height:40px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
.dr-szprev i{display:block;border-radius:50%}
.dr-sznum{font-size:17px;min-width:26px;text-align:center}
.dr-szstep{width:36px;height:36px;border-radius:50%;background:var(--fill2);font-size:20px;font-weight:700;flex:none}
.dr-sztrack{flex:1;height:6px;border-radius:3px;background:var(--fill2);position:relative;min-width:60px}
.dr-sztrack i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.dr-sztrack u{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.dr-szpop.dr-ph{display:none}

.dr-board{grid-column:3;display:flex;flex-direction:column;gap:10px;width:var(--cw);min-width:0}
.dr-strip{height:var(--strip);flex:none;display:flex;align-items:center;gap:12px;padding:0 8px 0 6px;border-radius:26px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair)}
.dr-q{height:40px;padding:0 14px;border-radius:20px;background:var(--accent);color:var(--on-accent);font-weight:800;display:flex;align-items:center;flex:none}
.dr-word{font-size:26px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.dr-word.blank{letter-spacing:.3em;color:var(--ink2)}
.dr-len{font-size:13px;color:var(--ink2);white-space:nowrap}
.dr-timer{font-size:26px;font-weight:800;min-width:66px;text-align:right;white-space:nowrap}
.dr-timer.low{color:var(--red)}
.dr-canvas{width:var(--cw);height:var(--ch);flex:none;background:var(--paper);border-radius:14px;position:relative;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.3)}
.dr-canvas>svg{width:100%;height:100%}
.dr-tbar{position:absolute;left:0;top:0;height:5px;background:var(--accent);border-radius:0 3px 3px 0}
.dr-under{height:var(--under);flex:none;display:flex;align-items:center;gap:10px}
.dr-hint{font-size:13px;color:var(--ink2);flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-input{flex:1;min-width:0;height:46px;border-radius:23px;border:0;background:var(--fill2);padding:0 18px;font-size:16px;outline:0}
.dr-input::placeholder{color:var(--ink3)}
.dr-log,.dr-ph{display:none}
.dr-topin,.dr-topq,.dr-topgive{display:none}

/* 단어 고르기 / 정답 공개: 그림판 위에 뜨는 판 */
.dr-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(12,10,9,.72);color:#fff;text-align:center;padding:12px}
.dr-over h3{margin:0;font-size:22px;font-weight:800}
.dr-over p{margin:0;color:var(--ink2);font-size:14px}
.dr-picks{display:flex;gap:12px}
.dr-pick{width:150px;padding:16px 8px;border-radius:18px;background:#fff;color:#111;display:flex;flex-direction:column;gap:4px;align-items:center}
.dr-pick small{font-size:12px;color:#777;font-weight:600}
.dr-pick b{font-size:22px;font-weight:800}
.dr-count{font-size:15px;font-weight:700;color:var(--accent)}
.dr-rev{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);min-width:60%;padding:14px 24px;border-radius:22px;background:rgba(20,18,16,.92);color:#fff;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px var(--hair);display:flex;flex-direction:column;gap:4px;white-space:nowrap}
.dr-rev small{font-size:13px;color:var(--ink2)}
.dr-rev b{font-size:34px;font-weight:800;color:var(--accent);letter-spacing:.04em}
.dr-rev span{font-size:15px;font-weight:600}
.dr-rev em{font-style:normal;color:var(--green);font-weight:800}

/* ---------- 로비·방 대기·최종 순위 (기존 로비 판 모양) ---------- */
.dr-center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:12px}
.dr-panel{background:var(--panel);border-radius:28px;box-shadow:inset 0 0 0 1px var(--hair),0 24px 64px rgba(0,0,0,.45);padding:24px;width:min(380px,calc(50vw - 20px));
  min-height:min(440px,calc(100dvh - 24px));max-height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.dr-panel h2{margin:0;font-size:22px;font-weight:700}
.dr-panel h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.dr-cap{margin:0;font-size:13px;color:var(--ink2)}
.dr-seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);padding:2px;border-radius:12px;background:var(--fill)}
.dr-seg span{height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
.dr-seg span.on{background:var(--accent);color:var(--on-accent)}
.dr-list{margin:0;padding:0;list-style:none;background:var(--fill);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dr-list li{display:flex;align-items:center;gap:10px;min-height:44px;padding:5px 14px;font-size:15px}
.dr-list li+li{box-shadow:inset 0 1px 0 var(--hair)}
.dr-list .dr-av{width:30px;height:30px;font-size:13px;box-shadow:none}
.dr-list .g{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-list small{color:var(--ink2);font-size:13px;white-space:nowrap}
.dr-list b.s{color:var(--accent)}
.dr-new{font-size:10.5px;font-weight:800;background:var(--accent);color:var(--on-accent);border-radius:7px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.dr-set{display:flex;flex-direction:column;gap:5px}
.dr-set label{font-size:13px;color:var(--ink2)}
.dr-set label small{color:var(--ink3)}
.dr-chips{display:flex;flex-wrap:wrap;gap:6px}
.dr-chips span{height:30px;padding:0 11px;border-radius:15px;display:flex;align-items:center;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink3);white-space:nowrap}
.dr-chips span.on{background:rgba(242,196,68,.2);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(242,196,68,.55)}
.dr-grow{flex:1}
.dr-codebig{font-size:34px;font-weight:800;letter-spacing:.16em;color:var(--accent)}
.dr-row{display:flex;gap:10px;align-items:center}
.dr-row>.dr-btn{flex:1}

.dr-final{width:min(760px,calc(100vw - 24px));min-height:0;flex-direction:row;gap:24px;align-items:stretch}
.dr-final>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.dr-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;flex:1}
.dr-pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px}
.dr-pod .dr-av{width:56px;height:56px;font-size:22px}
.dr-pod.first .dr-av{width:76px;height:76px;font-size:30px;box-shadow:inset 0 0 0 3px var(--accent),0 0 24px rgba(242,196,68,.55)}
.dr-pod .nm{font-weight:700;white-space:nowrap}
.dr-pod .st{width:100%;border-radius:12px 12px 0 0;background:var(--fill2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.dr-pod .st small{font-size:11.5px;color:var(--ink2);font-weight:600}
.dr-pod.first .st{background:var(--accent);color:var(--on-accent);height:96px}.dr-pod.first .st small{color:rgba(28,22,8,.7)}
.dr-pod.second .st{height:68px}.dr-pod.third .st{height:50px}

/* ---------- 휴대폰 가로 (높이 480px 이하) ---------- */
@media (max-height:480px){
  :root{--pad:8px;--gap:8px;--bar:40px;--strip:0px;--under:0px;--pw:150px;--palw:66px;--toolw:46px;--sl:44px;--sr:44px;
    --ch:min(calc(100dvh - var(--bar) - var(--pad)),calc((100vw - var(--sl) - var(--sr) - var(--pad)*2 - var(--pw) - var(--palw) - var(--toolw) - var(--gap)*3)*.75))}
  html,body{font-size:13px}
  .dr-bar{gap:8px}
  .dr-brand,.dr-code,.dr-bar .dr-sound,.dr-bar .dr-leave{display:none}
  .dr-ic{width:30px;height:30px}.dr-ic svg{width:15px;height:15px}
  .dr-topq{display:flex;align-items:center;gap:8px;min-width:0}
  .dr-q{height:28px;padding:0 10px;font-size:12.5px}
  .dr-word{font-size:19px}.dr-len{font-size:12px}
  .dr-timer{font-size:20px;min-width:48px}
  .dr-round{font-size:12px}.dr-round b{font-size:14px}
  .dr-strip,.dr-under{display:none}
  .dr-topgive{display:inline-flex;height:30px;padding:0 12px;font-size:12.5px}
  .dr-stage{grid-template-columns:var(--pw) var(--palw) var(--cw) var(--toolw);grid-template-rows:1fr 1fr;gap:4px var(--gap)}
  .dr-seats{height:auto;gap:4px}
  .dr-seats.l{grid-column:1;grid-row:1}.dr-seats.r{grid-column:1;grid-row:2}
  .dr-seat{flex-direction:row;justify-content:flex-start;padding:0 6px;gap:7px}
  .dr-avw{display:contents}
  .dr-who{flex:1;flex-direction:row;gap:7px;text-align:left}
  .dr-av,.dr-seat .dr-av{width:28px;height:28px;font-size:12.5px}
  .dr-av.dr-none{width:auto;height:auto;box-shadow:none;font-size:11.5px;padding-left:4px}
  .dr-nm{font-size:12.5px}.dr-sc{font-size:11px}.dr-sc b{font-size:12.5px}
  .dr-who>div{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
  .dr-ph{display:flex}hr.dr-ph{display:block}
  .dr-stage{align-content:start}.dr-seats{align-self:stretch}
  .dr-tag{display:none!important}
  .dr-seat:has(.dr-plus) .dr-sc{font-size:0}
  .dr-plus{font-size:12.5px}

const I = {

function seat(p, i, o) {
  if (!p) return `<div class="dr-seat empty"><span class="dr-av dr-none">빈 자리</span></div>`;
  const gain = o.gain && o.gain[i];                 // 정답 공개 때 이번 문제로 얻은 점수

  const q = `<span class="dr-q">문제</span>${o.pick ? `<span class="dr-len">${me ? '단어를 골라 주세요' : '지호 님이 고르는 중'}</span>` : wordHtml}`;

  lobby: () => `<div class="dr-center">

  room: () => `<div class="dr-center">
    <section class="dr-panel"><p class="dr-cap">${GAME_NAME} · 방 코드</p>
      <div class="dr-row"><span class="dr-codebig">KQZT</span><span class="dr-grow"></span><button class="dr-btn tint">복사</button></div>
      <h2>참가자 5 / 8</h2>
      <ul class="dr-list">${PL.slice(0, 5).map((p) => `<li><span class="dr-av" style="background:${p.c}">${p.n[0]}</span><span class="g">${p.n}</span><small>${p.host ? '방장' : ''}</small></li>`).join('')}</ul>
      <span class="dr-grow"></span><input class="dr-input" style="flex:none" placeholder="채팅"></section>
    <section class="dr-panel"><h2>방 설정 <small class="dr-cap">방장만 바꿀 수 있어요</small></h2>
      <div class="dr-set"><label>출제 순서 <small>· 자리 순서대로 돌아가며 그려요</small></label><div class="dr-seg" style="--n:3"><span class="on">순서대로</span><span>맞힌 사람</span><span>랜덤</span></div></div>
      <div class="dr-set"><label>라운드 수 <small>· 한 라운드에 모두 한 번씩 그려요</small></label><div class="dr-seg" style="--n:4"><span>1</span><span class="on">2</span><span>3</span><span>5</span></div></div>
      <div class="dr-set"><label>그리는 시간</label><div class="dr-seg" style="--n:3"><span>60초</span><span>90초</span><span class="on">2분 20초</span></div></div>
      <div class="dr-set"><label>주제 <small>· 눌러서 켜고 끄기</small></label><div class="dr-chips">${['음식', '동물', '직업', '장소', '스포츠', '물건', '취미', '탈것'].map((t) => `<span class="on">${t}</span>`).join('')}${['영화·만화', '나라·도시', '인물'].map((t) => `<span>${t}</span>`).join('')}</div></div>
      <p class="dr-cap">5명 × 2라운드 = 문제 10개 · 단어 3개 중 고르기 · 글자 수 표시</p>
      <span class="dr-grow"></span>
      <div class="dr-row"><button class="dr-btn danger" style="flex:0 0 auto">나가기</button><button class="dr-btn primary">시작</button></div></section></div>`,
  final: () => {
    const r = [['민수', '#1fa34a', 1120, 9], ['강식', '#b5651d', 960, 8], ['지호', '#2f6fde', 890, 7], ['태양', '#8b45d1', 720, 7], ['서연', '#d1456f', 540, 5], ['유나', '#e08a1a', 410, 4], ['도윤', '#3a9aa8', 180, 2]];
    const pod = (i, cls, rank) => `<div class="dr-pod ${cls}"><span class="dr-av" style="background:${r[i][1]}">${r[i][0][0]}</span><span class="nm">${r[i][0]}</span><div class="st">${rank}<small>${r[i][2]}점</small></div></div>`;
    return `<div class="dr-center"><section class="dr-panel dr-final">
      <div><h2>최종 순위</h2><div class="dr-podium">${pod(1, 'second', 2)}${pod(0, 'first', 1)}${pod(2, 'third', 3)}</div></div>
      <div><ul class="dr-list">${r.slice(3).map((p, i) => `<li><small>${i + 4}</small><span class="dr-av" style="background:${p[1]}">${p[0][0]}</span><span class="g">${p[0]}</span><small>맞힘 ${p[3]}</small><b class="s">${p[2]}점</b></li>`).join('')}</ul>
        <p class="dr-cap">빨리 맞힐수록, 내 그림을 많이 맞힐수록 점수가 높아요. 점수가 같으면 맞힌 횟수가 많은 사람이 위.</p>
        <span class="dr-grow"></span>
        <div class="dr-row"><button class="dr-btn tint">방으로</button><button class="dr-btn primary">한 판 더</button></div></div>
    </section></div>`;
  },
};
document.getElementById('app').innerHTML = (VIEWS[S] || VIEWS.draw)();

// ---------- 시안 전용: 말하기·정답 모션 시연 ----------
function demo(kind) {
  const seats = [...document.querySelectorAll('.dr-seat[data-i]:not(.turn):not(.off)')].filter((e) => kind === 'hit' ? !e.classList.contains('hit') : true);
  const el = seats[Math.floor(Math.random() * seats.length)];
  if (!el) return;
  const av = el.querySelector('.dr-av');
  const wrap = el.querySelector('.dr-avw');
  el.querySelector('.dr-say')?.remove();                       // 새 말이 오면 바로 교체
  const b = document.createElement('span');
  b.className = 'dr-say' + (kind === 'hit' || el.classList.contains('hit') ? ' ok' : '');
  b.textContent = kind === 'hit' || el.classList.contains('hit') ? '정답!' : ['짬뽕', '국수인가', '비빔면', '이거 뭐야 ㅋㅋㅋ', '파스타'][Math.floor(Math.random() * 5)];
  wrap.appendChild(b);
  if (kind === 'hit') { el.classList.add('hit'); wrap.querySelector('.dr-tag')?.remove(); wrap.insertAdjacentHTML('beforeend', '<span class="dr-tag ok">맞힘</span>'); }
  av.classList.remove('talk', 'cheer'); void av.offsetWidth; av.classList.add(kind === 'hit' ? 'cheer' : 'talk');
  setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 400); }, 3500);   // 3.5초 뒤 사라짐
}
document.getElementById('demoSay')?.addEventListener('click', (e) => { e.preventDefault(); demo('say'); });
document.getElementById('demoHit')?.addEventListener('click', (e) => { e.preventDefault(); demo('hit'); });
</script>
