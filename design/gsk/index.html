<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>갱스껄 — 정적 시안 (2차)</title>
<!--
  정적 시안(가짜 데이터). 실제 코드가 아니다. 그림은 전부 client/src/gsk/art.js 에서 온다.
  저장소 루트에서 서빙:  python3 -m http.server 8765  →  /design/gsk/index.html
  화면 고르기: 왼쪽 아래 버튼, 또는 주소 ?s=A~I   (&shot=1 이면 버튼 숨김)
  A 견본표 · B 내 차례 · C 경매 · D 뒤집기(해골) · E 벌칙 고르기 · F 결과 · G 휴대폰 가로(844x390)의 B
  H 레퍼런스(ref-1)와 같은 구도 · I 갱식마인드 방 화면과 나란히
  크기: PC 1280x720. 판 높이 500px 미만이면 휴대폰 배치.
  탁자·버튼·패널·프로필은 사이트 공통 모양(style.css 의 .pav .ic, 갱식마인드의 패널·알약 버튼)을 같은 값으로 흉내 낸 것이다.
  상단 줄은 실제로는 main.js 가 그리는 공통 줄이 들어간다(여기서는 모양만).
  시안이라 innerHTML 을 쓴다. 실제 화면에서는 사용자 글자를 textContent 로만 넣는다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--gold:#ffc62a;--accent:#f2c444;--on-accent:#1c1608;--ink:#fff;--ink2:rgba(255,255,255,.62);--ink3:rgba(255,255,255,.32);
  --fill:rgba(255,255,255,.09);--fill2:rgba(255,255,255,.16);--hair:rgba(255,255,255,.12);--panel:rgba(28,28,30,.62);--panel2:rgba(28,28,30,.92);--red:#ff453a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","WenQuanYi Zen Hei",sans-serif;font-size:15px;line-height:1.3;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{display:block}
.gk-art-disc,.gk-art-mat,.gk-art-marker,.gk-art-icon{display:block;width:100%;height:100%;overflow:visible}
/* 사이트 공통(style.css)과 같은 값 */
.ko{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;-webkit-text-stroke:3.5px #14100c;paint-order:stroke fill}
.num{font-family:"Bangers","Black Han Sans",sans-serif;font-weight:400;color:var(--gold);letter-spacing:1px;-webkit-text-stroke:4px #17110a;paint-order:stroke fill;text-shadow:0 2px 0 #17110a;line-height:1}
.pav{position:relative;display:block;border-radius:50%;overflow:hidden;border:3px solid #fff;background:#3a2f27 center/cover;box-shadow:0 3px 8px rgba(0,0,0,.7);flex:none}
.pav.letter{display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans",sans-serif;background:radial-gradient(circle at 50% 30%,#7a6858,#241c17)}
.ic{width:34px;height:34px;border-radius:50%;border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:64%;height:64%}

/* 시안 전용 */
.mk-nav{position:fixed;left:6px;bottom:6px;z-index:99;display:flex;gap:4px;opacity:.9}
.mk-nav a{font-size:11px;padding:3px 8px;border-radius:8px;background:#000;color:#fff;text-decoration:none;border:1px solid #555}
.mk-nav a.on{background:var(--accent);color:#000}
.mk-frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

/* ── 판 ── 바탕은 갱식마인드(.dr-root)와 같은 값 */
.gk-stage{position:relative;width:100%;height:100%;overflow:hidden;
  --mat:122px;--disc:90px;--hd:86px;--bar:54px;--av:54px;--fs:15px;
  background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(242,196,68,.10),transparent 70%),radial-gradient(ellipse at 50% 50%,#1d1813 0%,#0c0a09 75%)}
.gk-stage.phone{--mat:74px;--disc:55px;--hd:54px;--bar:40px;--av:30px;--fs:12px}
.gk-stage.boxed{width:844px;height:390px;flex:none;outline:1px solid rgba(255,255,255,.25)}
.gk-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6) 100%)}

/* 탁자: 깔끔한 어두운 펠트(1안) / 매끈한 어두운 원목(2안) */
.gk-table{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(ellipse 75% 70% at 50% 42%,#27433b 0%,#1b3029 52%,#12211c 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 70px rgba(0,0,0,.5),0 0 0 9px #17120f,0 0 0 10px rgba(242,196,68,.3),0 26px 70px rgba(0,0,0,.65)}
.gk-table::after{content:'';position:absolute;inset:5.5%;border-radius:50%;border:1px solid rgba(255,255,255,.07)}
.gk-table.wood{background:radial-gradient(ellipse 75% 70% at 50% 40%,#4a3528 0%,#35251c 55%,#231813 100%)}
.gk-stage.phone .gk-table{box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 40px rgba(0,0,0,.5),0 0 0 5px #17120f,0 0 0 6px rgba(242,196,68,.3),0 14px 40px rgba(0,0,0,.65)}

/* 상단 줄(사이트 공통 줄을 흉내) */
.gk-bar{position:absolute;left:0;right:0;top:0;height:var(--bar);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:6}
.gk-title{font-weight:800;font-size:calc(var(--fs) * 1.2);white-space:nowrap}
.gk-code{font-weight:800;font-size:var(--fs);letter-spacing:.14em;color:var(--accent)}
.gk-sp{flex:1}
.gk-rnd{color:var(--ink2);font-size:var(--fs);white-space:nowrap}
.gk-rnd b{color:#fff;font-size:calc(var(--fs) * 1.33)}
.gk-leave{height:44px;padding:0 20px;border-radius:999px;background:var(--fill2);font-weight:500;font-size:var(--fs)}
.gk-stage.phone .ic{width:28px;height:28px;border-width:2px}
.gk-stage.phone .gk-leave{height:30px;padding:0 13px}

/* 상황 띠(갱식마인드 문제 띠와 같은 모양) */
.gk-strip{position:absolute;left:50%;top:calc(var(--bar) / 2);transform:translate(-50%,-50%);z-index:6;display:flex;align-items:center;gap:10px;white-space:nowrap;
  padding:5px 16px 5px 6px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);font-size:var(--fs)}
.gk-strip .tag{padding:7px 14px;border-radius:999px;background:var(--accent);color:#1c1c1e;font-weight:800}
.gk-strip .tag.bad{background:var(--red);color:#fff}
.gk-strip .note{color:var(--ink2)}
.gk-strip b{color:var(--accent)}
.gk-stage.phone .gk-strip{padding:3px 12px 3px 4px;gap:7px}
.gk-stage.phone .gk-strip .tag{padding:4px 10px}

/* 자리 */
.gk-seat{position:absolute;width:0;height:0}
.gk-matw{position:absolute;left:calc(var(--mat) / -2);top:calc(var(--mat) / -2);width:var(--mat);height:var(--mat);
  filter:drop-shadow(0 calc(var(--mat) * .028) 0 var(--side)) drop-shadow(0 calc(var(--mat) * .07) calc(var(--mat) * .09) rgba(0,0,0,.55))}
.gk-mat{width:100%;height:100%;transform:rotate(var(--rot))}
.gk-mat img{width:100%;height:100%}
.gk-seat.turn .gk-matw::before{content:'';position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,198,42,.5),rgba(255,198,42,.16) 62%,transparent)}
.gk-seat.bad .gk-matw::before{content:'';position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,69,58,.55),rgba(255,69,58,.18) 62%,transparent)}
.gk-seat.dim .gk-matw,.gk-seat.dim .gk-pile{opacity:.5}
.gk-pile{position:absolute;left:0;top:0}
/* 원판 한 장: 그림자 두 겹(바닥에 붙은 진한 것 + 넓고 옅은 것). 필터를 쓰지 않는다 */
.gk-d{position:absolute;width:var(--disc);height:var(--disc);left:calc(var(--disc) / -2);top:calc(var(--disc) / -2);isolation:isolate;
  transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg)) scale(var(--s,1))}
.gk-d::before{content:'';position:absolute;z-index:-1;inset:-6% -10% -16% -10%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42) 55%,transparent)}
.gk-d::after{content:'';position:absolute;z-index:-1;inset:4% 1% -4% 1%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.75) 86%,transparent)}
.gk-d img,.gk-d svg{width:100%;height:100%}
.gk-d.hot{z-index:3}
.gk-d.hot::before{inset:-34%;background:radial-gradient(closest-side,rgba(255,69,58,.75) 48%,rgba(255,69,58,.22) 72%,transparent)}

/* 이름표: 갱식마인드 플레이어 칸과 같은 구성(큰 동그라미 프로필, 꼬리표, 이름, 아래 한 줄) */
.gk-who{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--fs) * .3);white-space:nowrap;text-align:center}
.gk-who .pav{width:var(--av);height:var(--av);font-size:calc(var(--av) * .5)}
.gk-avw{position:relative}
.gk-tag{position:absolute;left:50%;bottom:calc(var(--fs) * -.55);transform:translateX(-50%);padding:1px 8px;border-radius:999px;font-size:calc(var(--fs) * .73);font-weight:700;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.gk-tag.pass{background:#48484a;color:#d1d1d6}
.gk-tag.bad{background:var(--red);color:#fff}
.gk-seat.turn .gk-who .pav{border-color:var(--accent);box-shadow:0 0 0 4px rgba(242,196,68,.3),0 3px 8px rgba(0,0,0,.7)}
.gk-nm{font-weight:700;font-size:var(--fs);margin-top:calc(var(--fs) * .25);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.gk-nm i{font-style:normal;font-size:.72em;font-weight:700;color:var(--ink2);margin-left:4px}
.gk-meta{display:flex;align-items:center;gap:6px;font-size:calc(var(--fs) * .8);color:var(--ink2)}
.gk-chips{display:flex}
.gk-chips u{width:calc(var(--fs) * .8);height:calc(var(--fs) * .8);border-radius:50%;margin-left:calc(var(--fs) * -.22);background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75),0 1px 2px rgba(0,0,0,.6)}
.gk-chips u:first-child{margin-left:0}
.gk-pips{display:inline-flex;gap:3px}
.gk-pips b{width:calc(var(--fs) * .62);height:calc(var(--fs) * .62);transform:rotate(45deg);border-radius:2px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.gk-pips b.on{background:var(--gold);box-shadow:0 0 6px rgba(255,198,42,.8)}
.gk-who.me{flex-direction:row;gap:8px;text-align:left}
.gk-who.me .gk-nm{margin:0}
.gk-who.dimmed{opacity:.5}

/* 가운데: 큰 숫자 + 장식 해골 */
.gk-center{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.gk-cap{font-size:calc(var(--fs) * .87);color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.gk-cap .pav{width:calc(var(--fs) * 1.6);height:calc(var(--fs) * 1.6);border-width:2px;font-size:calc(var(--fs) * .8)}
.gk-cap b{color:#fff;font-weight:700}
.gk-big{font-size:calc(var(--mat) * .62)}
.gk-big small{font-size:.55em;color:#e9e1d2}
.gk-marker{width:calc(var(--mat) * .74);height:calc(var(--mat) * .86);margin-top:calc(var(--mat) * -.02)}
.gk-marker img{width:100%;height:100%}
.gk-fail{font-size:calc(var(--fs) * 1.9);color:#ff6b5e;margin-top:2px}
.gk-row{position:relative;height:calc(var(--disc) * 1.25);margin-top:calc(var(--fs) * .5)}

/* 내 손 */
.gk-hand{position:absolute}
.gk-h{position:absolute;width:var(--hd);height:var(--hd);left:calc(var(--hd) / -2);top:calc(var(--hd) / -2);isolation:isolate;transform:translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg))}
.gk-h::before{content:'';position:absolute;z-index:-1;inset:-4% -8% -16% -8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.45) 55%,transparent)}
.gk-h img,.gk-h svg{width:100%;height:100%}
.gk-h.pick::after{content:'';position:absolute;z-index:-1;inset:-9%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,198,42,.95) 86%,transparent)}
.gk-hlab{position:absolute;transform:translate(-50%,0);font-size:calc(var(--fs) * .78);color:var(--ink2);white-space:nowrap}

/* 아래 버튼 줄: 알약 패널 + 사이트 버튼 */
.gk-acts{position:absolute;left:50%;bottom:calc(var(--fs) * .8);transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:calc(var(--fs) * .55);white-space:nowrap;
  padding:calc(var(--fs) * .5);border-radius:999px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--hair),0 10px 30px rgba(0,0,0,.5)}
.gk-btn{height:calc(var(--fs) * 2.95);padding:0 calc(var(--fs) * 1.2);border-radius:999px;font-weight:700;font-size:var(--fs);display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1c1c1e}
.gk-btn i{width:calc(var(--fs) * 1.9);height:calc(var(--fs) * 1.9);margin-left:calc(var(--fs) * -.6);flex:none}
.gk-btn i img,.gk-btn i svg{width:100%;height:100%}
.gk-btn.sub{background:var(--fill2);color:#fff;font-weight:500}
.gk-btn.out{background:#3a1c1a;color:var(--red);font-weight:500}
.gk-btn.gold{background:var(--accent);color:var(--on-accent)}
.gk-sep{width:1px;align-self:stretch;margin:6px 2px;background:var(--hair)}
.gk-lab{font-size:calc(var(--fs) * .87);color:var(--ink2);padding:0 2px 0 6px;line-height:1.15}
.gk-lab b{display:block;color:#fff;font-size:var(--fs)}
.gk-nums{display:flex;gap:calc(var(--fs) * .35)}
.gk-n{width:calc(var(--fs) * 2.95);height:calc(var(--fs) * 2.95);border-radius:50%;background:var(--fill2);font-weight:800;font-size:calc(var(--fs) * 1.15)}
.gk-n.on{background:var(--accent);color:var(--on-accent)}
.gk-n.off{opacity:.3}

/* 덮개(사이트 .ov 와 같은 값) + 패널(갱식마인드 결과 창과 같은 값) */
.gk-veil{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.gk-sheet{padding:24px;border-radius:28px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--hair),0 30px 80px rgba(0,0,0,.6)}
.gk-sheet h2{margin:0;font-size:22px;font-weight:700}
.gk-sheet p{margin:6px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.gk-sheet p b{color:var(--accent)}
.gk-pen{width:560px;text-align:center}
.gk-headrow{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-bottom:12px}
.gk-headrow .pav{width:30px;height:30px;border-width:2px;font-size:15px}
.gk-headrow b{color:#fff}
.gk-picks{display:flex;justify-content:center;gap:34px;margin:30px 0 26px}
.gk-pick{position:relative;width:118px;height:118px;isolation:isolate}
.gk-pick::before{content:'';position:absolute;z-index:-1;inset:-4% -8% -16% -8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55) 55%,transparent)}
.gk-pick img{width:100%;height:100%}
.gk-pick.on{transform:translateY(-10px) scale(1.08)}
.gk-pick.on::after{content:'';position:absolute;z-index:-1;inset:-8%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,198,42,.95) 88%,transparent)}
.gk-foot{display:flex;gap:10px;justify-content:center}
.gk-foot .gk-btn{height:44px;min-width:180px;justify-content:center;font-size:15px}

/* 결과 */
.gk-res{width:760px;display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:stretch}
.gk-win{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gk-res h2{align-self:flex-start;font-weight:500}
.gk-wav{position:relative;margin-top:22px;width:132px;height:132px}
.gk-wav .pav{width:100%;height:100%;border:4px solid var(--accent);box-shadow:0 0 0 6px rgba(242,196,68,.22),0 0 40px rgba(242,196,68,.45),0 8px 20px rgba(0,0,0,.6);font-size:60px}
.gk-wmat{position:absolute;right:-26px;bottom:-12px;width:62px;height:62px;transform:rotate(12deg);filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.gk-wmat img{width:100%;height:100%}
.gk-win h1{margin:20px 0 0;font-size:40px;color:var(--gold);line-height:1}
.gk-wname{font-size:20px;font-weight:700;margin-top:8px}
.gk-wwhy{font-size:13px;color:var(--ink2);margin-top:2px}
.gk-ranks{border-radius:16px;overflow:hidden;background:var(--fill)}
.gk-rank{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-bottom:1px solid var(--hair)}
.gk-rank:last-child{border:0}
.gk-rank .rk{width:14px;color:var(--ink2);font-size:14px}
.gk-rank .pav{width:30px;height:30px;border-width:2px;font-size:15px}
.gk-rank .nm{flex:1;font-size:16px;font-weight:500}
.gk-rank .nm small{color:var(--ink2);font-size:12px;margin-left:6px}
.gk-rank .ds{display:flex;gap:3px}
.gk-rank .ds i{width:24px;height:24px}
.gk-rank .ds i img{width:100%;height:100%}
.gk-rank .ds i.no{border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);transform:scale(.86)}
.gk-rank .pt{color:var(--accent);font-weight:800;font-size:16px;width:40px;text-align:right}
.gk-rank.first{background:rgba(242,196,68,.14)}
.gk-rank.outp{opacity:.5}
.gk-resbtns{display:flex;gap:10px;margin-top:22px}
.gk-resbtns .gk-btn{flex:1;height:44px;justify-content:center;font-size:15px}

/* A 견본표 */
.gk-sw{position:absolute;inset:0;display:grid;grid-template-columns:1fr 400px;gap:22px;padding:18px 26px}
.gk-swg{display:grid;grid-template-columns:76px repeat(6,1fr);grid-template-rows:38px repeat(6,1fr);gap:6px 10px;align-items:center;justify-items:center;min-height:0}
.gk-swg .hd{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.gk-swg .hd small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.gk-swg .cn{justify-self:start;font-weight:800;font-size:17px;line-height:1.15}
.gk-swg .cn small{display:block;font-weight:500;font-size:11px;color:var(--ink2)}
.gk-swg .cell{position:relative;width:108px;height:108px;isolation:isolate}
.gk-swg .cell.d::before{content:'';position:absolute;z-index:-1;inset:-4% -8% -14% -8%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5) 55%,transparent)}
.gk-swg .cell.m{filter:drop-shadow(0 3px 0 rgba(0,0,0,.7)) drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.gk-swg .cell img,.gk-swg .cell svg{width:100%;height:100%}
.gk-swr{display:flex;flex-direction:column;gap:14px;min-height:0}
.gk-box{border-radius:22px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);padding:14px 16px}
.gk-box h3{margin:0 0 8px;font-size:14px;font-weight:700}
.gk-box h3 small{font-weight:400;color:var(--ink2);margin-left:6px}
.gk-mk{display:flex;align-items:center;gap:18px}
.gk-mk .m1{width:120px;height:139px}
.gk-mk .m2{width:56px;height:65px}
.gk-mk .m3{width:30px;height:35px}
.gk-mk img{width:100%;height:100%}
.gk-tb{position:relative;height:150px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1d1813 0%,#0c0a09 85%)}
.gk-tb .gk-table{left:50%;top:62%;width:440px;height:230px}
.gk-tb .gk-seat{left:50%;top:54%;--mat:92px;--disc:68px}
.gk-big3{font-size:20px}

/* H·I 비교 */
.gk-cmp{position:absolute;inset:0;display:flex;flex-direction:column;background:#0c0a09}
.gk-cmp .cap{position:absolute;left:14px;z-index:3;padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.7);font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px var(--hair)}
.gk-cmp .half{position:relative;flex:1;min-height:0;overflow:hidden}
.gk-cmp .half>img{width:100%;height:100%;object-fit:cover}
.gk-ours{position:absolute;inset:0;background:radial-gradient(ellipse 75% 90% at 50% 45%,#27433b 0%,#1b3029 55%,#101d19 100%)}
.gk-ours .gk-seat{--mat:146px;--disc:106px}
.gk-side{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:44px 10px 10px;background:#000}
.gk-side .pane{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--hair)}
.gk-side .pane img{width:100%;height:100%;object-fit:cover}
.gk-side iframe{border:0;width:1280px;height:720px;transform-origin:0 0}
.gk-side .lbl{position:absolute;top:10px;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div class="mk-frame"><div class="gk-stage" id="stage"></div></div>
<div class="mk-nav" id="nav"></div>

<script type="module">
import { COLORS, discSkull, skullIcon, discBackUrl, discFlowerUrl, discSkullUrl, matUrl, skullMarkerUrl } from '../../client/src/gsk/art.js';

// ── 가짜 프로필 사진(직접 그린 것). 비율이 달라도 원 안에 꽉 차는지 보려고 세로·가로를 섞었다 ──
const svgUrl = (w, h, body) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w * 4}" height="${h * 4}">${body}</svg>`);
const AV = {
  // 세로로 긴 사진: 노을빛 고양이
  cat: svgUrl(90, 120, `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff5e7e"/></linearGradient></defs>
    <rect width="90" height="120" fill="url(#g)"/><circle cx="70" cy="18" r="26" fill="#fff" opacity=".18"/>
    <path d="M14,52L20,22L40,40ZM76,52L70,22L50,40Z" fill="#3b2a4a"/><ellipse cx="45" cy="64" rx="33" ry="29" fill="#3b2a4a"/>
    <ellipse cx="33" cy="60" rx="5.5" ry="7.5" fill="#ffe36b"/><ellipse cx="57" cy="60" rx="5.5" ry="7.5" fill="#ffe36b"/><ellipse cx="33" cy="60" rx="1.8" ry="6" fill="#1a1024"/><ellipse cx="57" cy="60" rx="1.8" ry="6" fill="#1a1024"/>
    <path d="M42,71h6l-3,4z" fill="#ff8fa3"/><path d="M45,75q-5,6 -10,2M45,75q5,6 10,2" stroke="#ffd7de" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M10,120q35,-34 70,0z" fill="#3b2a4a"/>`),
  // 정사각 사진: 줄무늬 배경 + 안경
  specs: svgUrl(100, 100, `<rect width="100" height="100" fill="#123b5c"/>
    <g stroke="#1f6f8f" stroke-width="9">${[-60, -30, 0, 30, 60, 90, 120].map((x) => `<path d="M${x},110L${x + 60},-10"/>`).join('')}</g>
    <circle cx="50" cy="52" r="30" fill="#ffd9b0"/><path d="M20,46q4,-32 30,-30q28,-2 30,30q-12,-16 -30,-14q-18,-2 -30,14z" fill="#2a1a12"/>
    <g fill="none" stroke="#10222e" stroke-width="3"><circle cx="38" cy="54" r="9"/><circle cx="62" cy="54" r="9"/><path d="M47,54h6"/></g>
    <circle cx="38" cy="54" r="2.4" fill="#10222e"/><circle cx="62" cy="54" r="2.4" fill="#10222e"/>
    <path d="M40,68q10,8 20,0" stroke="#a84a3a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M8,100q42,-22 84,0z" fill="#e8553f"/>`),
  // 정사각 사진: 물방울 무늬 + 곰
  bear: svgUrl(100, 100, `<rect width="100" height="100" fill="#6b3fd1"/>
    <g fill="#ffd23f">${[[12, 14], [46, 8], [84, 18], [28, 40], [70, 46], [10, 70], [90, 76], [50, 92]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6"/>`).join('')}</g>
    <circle cx="27" cy="30" r="13" fill="#8a5a36"/><circle cx="73" cy="30" r="13" fill="#8a5a36"/><circle cx="27" cy="30" r="6" fill="#e9b98a"/><circle cx="73" cy="30" r="6" fill="#e9b98a"/>
    <circle cx="50" cy="56" r="33" fill="#8a5a36"/><ellipse cx="50" cy="66" rx="15" ry="12" fill="#e9b98a"/>
    <circle cx="37" cy="50" r="4" fill="#20120a"/><circle cx="63" cy="50" r="4" fill="#20120a"/><ellipse cx="50" cy="61" rx="5" ry="3.6" fill="#20120a"/>
    <path d="M50,64v6q-5,5 -9,1M50,70q5,5 9,1" stroke="#20120a" stroke-width="2" fill="none" stroke-linecap="round"/>`),
  // 가로로 긴 사진: 얼굴 없는 풍경
  hill: svgUrl(160, 90, `<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4c9b"/><stop offset=".7" stop-color="#f6a85c"/></linearGradient></defs>
    <rect width="160" height="90" fill="url(#s)"/><circle cx="84" cy="50" r="17" fill="#fff3c4"/>
    <path d="M0,70L38,34L66,62L96,26L160,74V90H0z" fill="#27324f"/><path d="M0,78q40,-16 80,-4t80,-6V90H0z" fill="#12182b"/>
    <path d="M96,26l10,12l-8,-2l-6,8z" fill="#fff" opacity=".8"/>`),
  // 정사각: 바둑판 + 로봇
  bot: svgUrl(100, 100, `<rect width="100" height="100" fill="#0f5132"/>
    <g fill="#198754">${Array.from({ length: 25 }, (_, i) => ((i % 5) + ((i / 5) | 0)) % 2 ? '' : `<rect x="${(i % 5) * 20}" y="${((i / 5) | 0) * 20}" width="20" height="20"/>`).join('')}</g>
    <path d="M50,14v12" stroke="#dfe6e9" stroke-width="4"/><circle cx="50" cy="12" r="5" fill="#ff7675"/>
    <rect x="22" y="26" width="56" height="48" rx="12" fill="#dfe6e9"/><rect x="30" y="38" width="16" height="13" rx="4" fill="#0984e3"/><rect x="54" y="38" width="16" height="13" rx="4" fill="#0984e3"/>
    <path d="M34,61h32" stroke="#2d3436" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7"/><rect x="34" y="78" width="32" height="22" fill="#b2bec3"/>`),
  // 정사각: 달밤
  moon: svgUrl(100, 100, `<defs><radialGradient id="m" cx=".6" cy=".35" r=".9"><stop offset="0" stop-color="#b56cff"/><stop offset="1" stop-color="#1a0b3a"/></radialGradient></defs>
    <rect width="100" height="100" fill="url(#m)"/><circle cx="56" cy="46" r="27" fill="#ffe9a8"/><circle cx="68" cy="38" r="24" fill="#6a34b8"/>
    <g fill="#fff">${[[14, 18, 1.6], [30, 70, 2], [84, 76, 1.4], [20, 44, 1.2], [78, 14, 1.8], [50, 88, 1.3]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`),
};

// ── 가짜 사람들. 0번이 나, 그 뒤는 시계 방향 ──
const P = [
  { id: 'me', name: '하린', color: 4, photo: AV.cat },
  { id: 'a', name: '도윤', color: 0, photo: AV.specs },
  { id: 'b', name: '민서', color: 1, photo: null },
  { id: 'c', name: '지호', color: 2, photo: AV.bear, points: 1 },
  { id: 'd', name: '서아', color: 5, photo: AV.hill },
];
const JIT = [[0, 0, -4], [.04, -.07, 6], [-.035, -.14, -8], [.03, -.21, 3]];   // 쌓인 원판이 어긋나는 정도(원판 크기 기준)

// 상태(9-2 모양을 줄인 것). stack = 판 위 엎어 둔 장수
const S = {
  B: {
    round: 3, turn: 'me', total: 8,
    seats: [{ hand: 3, stack: 1 }, { hand: 2, stack: 2 }, { hand: 3, stack: 1 }, { hand: 1, stack: 2 }, { hand: 2, stack: 2 }],
    mine: ['F', 'F', 'S'], strip: ['내 차례', '원판을 하나 더 내거나 <b>도전</b>을 시작하세요'], stripS: ['내 차례', '원판 내기 또는 <b>도전</b>'],
    center: { cap: '판 위 원판', n: 8 },
    acts: 'turn',
  },
  C: {
    round: 3, turn: 'me', total: 9,
    seats: [{ hand: 2, stack: 2 }, { hand: 2, stack: 2, passed: 1 }, { hand: 2, stack: 2 }, { hand: 1, stack: 2, tag: '도전 5' }, { hand: 3, stack: 1, passed: 1 }],
    mine: ['F', 'F'], strip: ['내 차례', '더 높이 부르거나 <b>패스</b> · 판 위 원판 9장'],
    center: { by: 3, cap: '님이 부름', n: 5 },
    acts: 'bid',
  },
  D: {
    round: 3, turn: null, total: 9,
    seats: [{ hand: 2, stack: 1, bad: 1, tag: '해골 주인', tagc: 'bad' }, { hand: 2, stack: 1 }, { hand: 2, stack: 0, tag: '도전 5', hot: 1 }, { hand: 1, stack: 2 }, { hand: 3, stack: 1 }],
    mine: ['F', 'F'], strip: ['해골!', '<b>민서</b> 님의 도전 실패 · <b>하린</b> 님의 해골이 나왔습니다', 'bad'],
    flip: { n: [3, 5], row: [[2, 'F'], [2, 'F'], [1, 'F'], [0, 'S']] },
  },
  F: { round: 6, total: 0, seats: [{ hand: 3, stack: 0 }, { hand: 4, stack: 0 }, { hand: 0, stack: 0, out: 1 }, { hand: 3, stack: 0, points: 2 }, { hand: 2, stack: 0 }], mine: ['F', 'F', 'S'], result: 1, strip: ['끝', '지호 님 승리'] },
};
S.E = { ...S.D, penalty: 1 };
S.G = S.B;

const q = new URLSearchParams(location.search);
const key = (q.get('s') || 'B').toUpperCase();
const stage = document.getElementById('stage');
document.getElementById('nav').innerHTML = q.get('shot') ? '' : 'ABCDEFGHI'.split('').map((k) => `<a href="?s=${k}" class="${k === key ? 'on' : ''}">${k}</a>`).join('');

const img = (u) => `<img src="${u}" alt="" draggable="false">`;
const nameColor = (p) => COLORS[p.color].light;
const avatar = (p) => p.photo ? `<span class="pav" style="background-image:url('${p.photo}')"></span>` : `<span class="pav letter">${p.name[0]}</span>`;
const pips = (n) => `<span class="gk-pips"><b class="${n > 0 ? 'on' : ''}"></b><b class="${n > 1 ? 'on' : ''}"></b></span>`;
// 사진이 든 해골만 SVG 를 그대로 넣고, 나머지는 색마다 한 번 만든 그림을 <img> 로 쓴다
const face = (p, k) => k === 'S' ? (p.photo ? discSkull(p.color, p.photo) : img(discSkullUrl(p.color))) : img(discFlowerUrl(p.color));
const pile = (color, n) => Array.from({ length: n }, (_, j) =>
  `<div class="gk-d" style="--x:calc(var(--disc) * ${JIT[j][0]});--y:calc(var(--disc) * ${JIT[j][1]});--r:${JIT[j][2]}deg">${img(discBackUrl(color))}</div>`).join('');
const matHtml = (color, flipped, rot) => `<div class="gk-matw" style="--side:${COLORS[color].deep}"><div class="gk-mat" style="--rot:${rot}deg">${img(matUrl(color, flipped))}</div></div>`;

// 자리: 내 자리가 아래 가운데, 나머지는 시계 방향으로 타원 둘레. 개인판은 가운데를 향해 돌려 놓는다
function geo(phone) {
  const W = stage.clientWidth, H = stage.clientHeight;
  const g = { W, H, cx: W / 2, cy: H * (phone ? .475 : .47), rx: W * (phone ? .275 : .262), ry: H * (phone ? .262 : .272) };
  g.seat = (i, n) => {
    const a = (90 + i * 360 / n) * Math.PI / 180;
    const x = g.cx + g.rx * Math.cos(a), y = g.cy + g.ry * Math.sin(a);
    return { x, y, rot: i ? Math.atan2(g.cy - y, g.cx - x) * 180 / Math.PI + 90 : 0, side: x < g.cx ? -1 : 1 };
  };
  return g;
}

function seatHtml(st, i, g, phone) {
  const p = P[i], s = st.seats[i], pos = g.seat(i, P.length);
  const points = s.points ?? p.points ?? 0;
  const mat = parseFloat(getComputedStyle(stage).getPropertyValue('--mat'));
  const tag = st.turn === p.id ? `<span class="gk-tag">${i ? '차례' : '내 차례'}</span>`
    : s.passed ? '<span class="gk-tag pass">패스</span>'
    : s.out ? '<span class="gk-tag pass">탈락</span>'
    : s.tag ? `<span class="gk-tag ${s.tagc || ''}">${s.tag}</span>` : '';
  const chips = `<span class="gk-chips" style="--c:${COLORS[p.color].base}"><u></u></span>손 ${s.hand}`;
  const cls = `${st.turn === p.id ? 'turn' : ''} ${s.bad ? 'bad' : ''} ${s.hot ? 'turn' : ''} ${s.passed || s.out ? 'dim' : ''}`;
  let who;
  if (i) {
    const lx = pos.x + pos.side * (mat * .5 + (phone ? 34 : 70));
    who = `<div class="gk-who ${s.passed || s.out ? 'dimmed' : ''}" style="left:${lx - pos.x}px;top:${phone ? 0 : -4}px">
      <span class="gk-avw">${avatar(p)}${tag}</span><span class="gk-nm" style="color:${nameColor(p)}">${p.name}</span>
      <span class="gk-meta">${chips}${pips(points)}</span></div>`;
  } else {
    // 나: 손 왼쪽에 가로 한 줄
    who = `<div class="gk-who me" style="left:${-(mat * .5 + parseFloat(getComputedStyle(stage).getPropertyValue('--hd')) * 1.72 + (phone ? 44 : 78))}px;top:0">
      <span class="gk-avw">${avatar(p)}${tag}</span><span><span class="gk-nm" style="color:${nameColor(p)}">${p.name}<i>나</i></span>
      <span class="gk-meta">${pips(points)}</span></span></div>`;
  }
  return `<div class="gk-seat ${cls}" style="left:${pos.x}px;top:${pos.y}px">${matHtml(p.color, points > 0, pos.rot)}
    <div class="gk-pile">${pile(p.color, s.stack)}</div>${who}${i ? '' : handHtml(st, mat)}</div>`;
}

// 내 손: 꽃은 개인판 왼쪽에 겹쳐서, 해골은 오른쪽에 (앞면이 보인다)
function handHtml(st, mat) {
  const me = P[0];
  const fl = st.mine.filter((k) => k === 'F'), sk = st.mine.includes('S');
  let h = '';
  fl.forEach((k, j) => {
    h += `<div class="gk-h ${st.acts === 'turn' && j === fl.length - 1 ? '' : ''}" style="--x:calc(${-mat * .5}px - var(--hd) * ${(0.62 + (fl.length - 1 - j) * .52).toFixed(2)});--y:${j % 2 ? -3 : 2}px;--r:${[-7, 5, -3][j]}deg">${face(me, k)}</div>`;
  });
  if (sk) h += `<div class="gk-h" style="--x:calc(${mat * .5}px + var(--hd) * .62);--r:6deg">${face(me, 'S')}</div>`;
  return `<div class="gk-hand">${h}</div>`;
}

function centerHtml(st, g) {
  let h = '';
  if (st.flip) {
    const n = st.flip.row.length;
    h = `<div class="gk-big num">${st.flip.n[0]}<small> / ${st.flip.n[1]}</small></div><div class="gk-fail ko">해골! 도전 실패</div>
      <div class="gk-row" style="width:calc(var(--disc) * ${(1 + (n - 1) * .6 + .3).toFixed(2)})">${st.flip.row.map(([pi, k], j) => {
        const hot = k === 'S';
        return `<div class="gk-d ${hot ? 'hot' : ''}" style="left:calc(var(--disc) * ${(j * .6 + (hot ? .18 : 0)).toFixed(2)});top:calc(var(--disc) * .125);--r:${hot ? -6 : [5, -4, 3][j % 3]}deg;--s:${hot ? 1.24 : 1}">${face(P[pi], k)}</div>`;
      }).join('')}</div>`;
  } else if (st.center) {
    const c = st.center, by = c.by != null ? P[c.by] : null;
    h = `<div class="gk-cap">${by ? `${avatar(by)}<b style="color:${nameColor(by)}">${by.name}</b>` : ''}${c.cap}</div>
      <div class="gk-big num">${c.n}</div><div class="gk-marker">${img(skullMarkerUrl())}</div>`;
  }
  return `<div class="gk-center" style="left:${g.cx}px;top:${g.cy - (st.flip ? g.H * .015 : g.H * .02)}px">${h}</div>`;
}

function actsHtml(st) {
  const me = P[0], mini = (k) => `<i>${face(me, k)}</i>`;
  const nums = (from, to, on) => `<div class="gk-nums">${Array.from({ length: to - from + 1 }, (_, i) => `<button class="gk-n ${from + i === on ? 'on' : ''}">${from + i}</button>`).join('')}</div>`;
  if (st.acts === 'turn') {
    return `<div class="gk-acts"><button class="gk-btn">${mini('F')}꽃 내기</button><button class="gk-btn">${mini('S')}해골 내기</button>
      <span class="gk-sep"></span><span class="gk-lab"><b>도전</b>꽃만 몇 장?</span>${nums(1, st.total, 0)}</div>`;
  }
  if (st.acts === 'bid') {
    return `<div class="gk-acts"><button class="gk-btn sub">패스</button><span class="gk-sep"></span>
      <span class="gk-lab"><b>올리기</b>${st.center.n}보다 크게</span>${nums(st.center.n + 1, st.total, 0)}</div>`;
  }
  return '';
}

function penaltyHtml() {
  const c = P[2];
  return `<div class="gk-veil"><div class="gk-sheet gk-pen">
    <span class="gk-headrow">${avatar(c)}<span><b>${c.name}</b> 님의 도전 실패 · 남은 원판 3장</span></span>
    <h2>버릴 원판 하나를 고르세요</h2>
    <p>내 해골이 나왔으니 <b>내가</b> 고릅니다. 뒷면으로 섞여 있어요.</p>
    <div class="gk-picks"><div class="gk-pick">${img(discBackUrl(c.color))}</div><div class="gk-pick on">${img(discBackUrl(c.color))}</div><div class="gk-pick">${img(discBackUrl(c.color))}</div></div>
    <div class="gk-foot"><button class="gk-btn">이 원판 버리기</button></div>
    <p style="margin-top:14px">무엇을 버렸는지는 ${c.name} 님만 압니다</p>
  </div></div>`;
}

function resultHtml() {
  const w = P[3];
  const order = [[3, 2, 3], [1, 0, 4], [0, 0, 3], [4, 0, 2], [2, 0, 0]];   // [사람, 점수, 남은 원판]
  return `<div class="gk-veil"><div class="gk-sheet gk-res">
    <div class="gk-win"><h2>결과</h2><div class="gk-wav">${avatar(w)}<div class="gk-wmat">${img(matUrl(w.color, true))}</div></div>
      <h1 class="ko">갱스껄 승리!</h1><div class="gk-wname" style="color:${nameColor(w)}">${w.name}</div><div class="gk-wwhy">도전 두 번 성공 · 6라운드</div></div>
    <div><div class="gk-ranks">${order.map(([i, pt, ds], r) => {
      const p = P[i];
      return `<div class="gk-rank ${r ? '' : 'first'} ${ds ? '' : 'outp'}"><span class="rk">${r + 1}</span>${avatar(p)}
        <span class="nm">${p.name}${i ? '' : '<small>나</small>'}${ds ? '' : '<small>탈락</small>'}</span>
        <span class="ds">${[0, 1, 2, 3].map((d) => d < ds ? `<i>${img(discBackUrl(p.color))}</i>` : '<i class="no"></i>').join('')}</span><span class="pt">${pt}점</span></div>`;
    }).join('')}</div>
    <div class="gk-resbtns"><button class="gk-btn sub">방으로</button><button class="gk-btn">한 판 더</button></div></div>
  </div></div>`;
}

function swatches() {
  const photos = [AV.specs, AV.moon, AV.bear, AV.bot, AV.cat, AV.hill];
  const heads = [['원판 뒷면', '꽃·해골 같음'], ['꽃', '색마다 다른 꽃'], ['해골 · 사진 있음', '원 안에 꽉 차게'], ['해골 · 사진 없음', '장식 해골'], ['개인판 앞면', '0점'], ['개인판 뒷면', '1점 · 흰·금 테']];
  let h = '<span></span>' + heads.map(([a, b]) => `<div class="hd">${a}<small>${b}</small></div>`).join('');
  COLORS.forEach((c, i) => {
    h += `<div class="cn" style="color:${c.light}">${c.name}<small>${c.flower} · ${c.base}</small></div>`
      + `<div class="cell d">${img(discBackUrl(i))}</div><div class="cell d">${img(discFlowerUrl(i))}</div><div class="cell d">${discSkull(i, photos[i])}</div><div class="cell d">${img(discSkullUrl(i))}</div>`
      + `<div class="cell m">${img(matUrl(i, false))}</div><div class="cell m">${img(matUrl(i, true))}</div>`;
  });
  const tb = (cls, color) => `<div class="gk-tb"><div class="gk-table ${cls}"></div><div class="gk-seat">${matHtml(color, false, -14)}<div class="gk-pile">${pile(color, 3)}</div></div></div>`;
  return `<div class="gk-sw"><div class="gk-swg">${h}</div><div class="gk-swr">
    <div class="gk-box"><h3>가운데 해골 마커<small>탁자 가운데 · 큰 숫자 아래</small></h3><div class="gk-mk"><div class="m1">${img(skullMarkerUrl())}</div><div class="m2">${img(skullMarkerUrl())}</div><div class="m3">${img(skullMarkerUrl())}</div><span class="num" style="font-size:64px;margin-left:16px">8</span></div></div>
    <div class="gk-box"><h3>탁자 1안 · 어두운 펠트<small>시안 B~G 에 쓴 것</small></h3>${tb('', 3)}</div>
    <div class="gk-box"><h3>탁자 2안 · 매끈한 어두운 원목<small>결 없음</small></h3>${tb('wood', 5)}</div>
  </div></div>`;
}

// H: 레퍼런스 사진과 같은 구도(위 개인판 6장, 아래 원판 4장씩 겹쳐서)
function refCompare() {
  const W = stage.clientWidth, hh = stage.clientHeight / 2;
  const photos = [AV.specs, null, AV.bear, null, AV.cat, AV.hill];
  let s = '';
  COLORS.forEach((c, i) => {
    const x = W * (.188 + i * .1375), y = hh * .245;
    s += `<div class="gk-seat" style="left:${x}px;top:${y}px">${matHtml(i, i === 3, [-1, 1, 0, -1, 1, -2][i])}</div>`;
    const cx = W * (.115 + i * .154), cy = hh * .685, d = 106;
    const four = [img(discBackUrl(i)), img(discBackUrl(i)), img(discFlowerUrl(i)), photos[i] ? discSkull(i, photos[i]) : img(discSkullUrl(i))];
    s += `<div class="gk-seat" style="left:${cx}px;top:${cy}px">` + four.map((f, j) =>
      `<div class="gk-d" style="--x:${(j % 2 ? .43 : -.43) * d + [3, -2, -4, 2][j]}px;--y:${(j < 2 ? -.4 : .4) * d + [0, 4, -3, 2][j]}px;--r:${[-6, 9, 4, -5][j]}deg">${f}</div>`).join('') + '</div>';
  });
  return `<div class="gk-cmp"><div class="half"><span class="cap" style="top:10px">레퍼런스 (실물 사진)</span><img src="ref/ref-1-pieces.png" alt=""></div>
    <div class="half"><span class="cap" style="top:10px">갱스껄 (새로 그린 것 · 아래 줄 = 뒷면 2 + 꽃 + 해골)</span><div class="gk-ours">${s}</div></div></div>`;
}

// I: 갱식마인드 방 화면과 나란히
function siteCompare() {
  const w = (stage.clientWidth - 30) / 2, k = w / 1280;
  return `<div class="gk-side"><span class="lbl" style="left:14px">갱식마인드 · 방 화면 (지금 사이트)</span><span class="lbl" style="left:calc(50% + 9px)">갱스껄 · 내 차례 (시안 B)</span>
    <div class="pane" style="height:${800 * k}px"><img src="../draw/shots/room-pc.png" alt=""></div>
    <div class="pane" style="height:${720 * k}px"><iframe src="?s=B&shot=1" style="transform:scale(${k})"></iframe></div></div>`;
}

function render() {
  const boxed = key === 'G' && (innerWidth > 860 || innerHeight > 400);
  stage.classList.toggle('boxed', boxed);
  const phone = stage.clientHeight < 500 && key !== 'H' && key !== 'I';
  stage.classList.toggle('phone', phone);
  if (key === 'A') { stage.innerHTML = swatches(); return; }
  if (key === 'H') { stage.innerHTML = refCompare(); return; }
  if (key === 'I') { stage.innerHTML = siteCompare(); return; }
  const st = S[key] || S.B, g = geo(phone);
  const icon = (d) => `<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`;
  const strip = phone && st.stripS ? st.stripS : st.strip;
  const mat = phone ? 74 : 122;
  stage.innerHTML = `<div class="gk-table" style="left:${g.cx}px;top:${g.cy + g.H * .012}px;width:${2 * (g.rx + mat * (phone ? 1.5 : 1.52))}px;height:${2 * (g.ry + mat * (phone ? .78 : .86))}px"></div>`
    + '<div class="gk-vig"></div>'
    + `<div class="gk-bar">${icon('<path d="M5 7h14M5 12h14M5 17h14"/>')}<span class="gk-title">갱스껄</span><span class="gk-code">KQZT</span><span class="gk-sp"></span>`
    + `<span class="gk-rnd">라운드 <b>${st.round}</b></span>` + icon('<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14.2a4.4 4.4 0 0 0 7 0"/><path d="M9 9.6h.01M15 9.6h.01"/>')
    + icon('<path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5z"/><path d="M16 9.3a3.8 3.8 0 0 1 0 5.4"/>') + '<button class="gk-leave">나가기</button></div>'
    + (st.result ? '' : `<div class="gk-strip"><span class="tag ${strip[2] || ''}">${strip[0]}</span><span class="note">${strip[1]}</span></div>`)
    + P.map((_, i) => seatHtml(st, i, g, phone)).join('')
    + (st.result ? '' : centerHtml(st, g)) + (st.result || st.penalty ? '' : actsHtml(st))
    + (st.penalty ? penaltyHtml() : '') + (st.result ? resultHtml() : '');
}
render();
addEventListener('resize', render);
const pics = [...document.images].map((im) => im.decode ? im.decode().catch(() => {}) : 0);
Promise.all([document.fonts.ready, ...pics]).then(() => { window.__ready = true; });
void skullIcon;
</script>
</body>
</html>
