<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 차례 (동작)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&amp;family=Gowun+Batang:wght@400;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.gk{--bw:128px;--bh:117px;--ds:80px;--th:5px;--bs:28px;width:1280px;height:720px;position:relative;overflow:hidden;background:#2a1c14 url(/_blob/334cf2e0c7edf16b229c755f2bc9b04f) center / cover no-repeat;font-family:'IBM Plex Sans KR',sans-serif;color:#efe6d2;-webkit-font-smoothing:antialiased}
.gk *{box-sizing:border-box}
.gk-vig{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 28%,rgba(8,5,3,.66) 100%);pointer-events:none}
.gk-top{position:absolute;left:28px;top:20px;display:flex;align-items:center;gap:12px;font:400 15px/20px 'Gowun Batang',serif;color:#d9ccb0;letter-spacing:.06em}
.gk-top b{font-weight:700;color:#efe6d2;font-size:17px;letter-spacing:.1em}
.gk-top i{display:block;width:26px;height:1px;background:#c9a45c;opacity:.7}
.gk-seat{position:absolute;width:var(--bw);height:var(--bh);margin:calc(var(--bh) / -2) 0 0 calc(var(--bw) / -2)}
.gk-board{position:absolute;left:0;top:0;width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.gk-pile{position:absolute;left:50%;top:50%;width:0;height:0}
.gk-dk{position:absolute;width:var(--ds);height:var(--ds);margin:calc(var(--ds) / -2) 0 0 calc(var(--ds) / -2)}
.gk-dk::before{content:"";position:absolute;left:0;top:var(--th);width:100%;height:100%;border-radius:50%;background:linear-gradient(#523a27 50%,#2a1c12);box-shadow:inset 0 -1.5px 0 rgba(236,210,150,.85),0 2px 3px rgba(0,0,0,.7)}
.gk-dk img{position:relative;display:block;width:100%;height:100%}
.gk-hi{position:absolute;width:var(--ds);height:var(--ds);margin:calc(var(--ds) / -2) 0 0 calc(var(--ds) / -2);border-radius:50%;background:radial-gradient(circle at 34% 24%,rgba(255,250,235,.3),rgba(255,250,235,0) 56%);box-shadow:inset 0 0 0 1.5px rgba(243,234,215,.55),0 0 10px rgba(236,210,150,.3);pointer-events:none}
.gk-n{position:absolute;width:var(--bs);height:var(--bs);display:flex;align-items:center;justify-content:center;font:600 15px/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;color:#f3ead7;pointer-events:none}
.gk-n::before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;transform:rotate(45deg) scale(.86);background:#1c1410;border:1px solid #c9a45c;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.gk-n span{position:relative}
.gk-snd{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(201,164,92,.5);background:rgba(18,12,8,.66);color:#efe6d2;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.gk-snd:hover{background:rgba(40,28,20,.85)}
.gk-snd svg{display:block}
.gk-turn{position:absolute;left:-7px;top:-7px;right:-7px;bottom:-7px;border:1.5px solid rgba(236,210,150,.95);border-radius:20px;box-shadow:0 0 18px rgba(236,210,150,.42),inset 0 0 10px rgba(236,210,150,.2)}
.gk-turn.red{border-color:rgba(214,84,70,.95);box-shadow:0 0 26px rgba(200,50,40,.7),inset 0 0 12px rgba(200,50,40,.35)}
.gk-tag{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;padding:5px 15px 5px 5px;border-radius:999px;background:rgba(18,12,8,.66);border:1px solid rgba(201,164,92,.3);white-space:nowrap}
.gk-tag.on{border-color:rgba(236,210,150,.9)}
.gk-av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block;background:#1c1410}
.gk-nm{font-size:14px;font-weight:500;line-height:18px;color:#efe6d2;display:flex;align-items:center;gap:6px}
.gk-dot{width:6px;height:6px;border-radius:50%;display:block}
.gk-meta{display:flex;align-items:center;gap:5px;font-size:11px;line-height:14px;color:#c8bca4;margin-top:2px}
.gk-pip{width:7px;height:7px;transform:rotate(45deg);border:1px solid #c9a45c;display:block}
.gk-pip.on{background:#c9a45c}
.gk-meta svg{display:block;margin-left:5px}
.gk-chip{font-size:11px;line-height:16px;padding:0 7px;border-radius:999px;border:1px solid #c9a45c;color:#ecd296;margin-left:4px}
.gk-chip.mute{border-color:rgba(200,188,164,.5);color:#c8bca4}
.gk-mid{position:absolute;left:640px;top:300px;width:270px;transform:translate(-50%,-50%);text-align:center}
.gk-cap{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.34em;text-indent:.34em;color:#d2b06a}
.gk-numrow{display:flex;align-items:center;justify-content:center;gap:14px}
.gk-numrow i{display:block;width:44px;height:1px;background:linear-gradient(90deg,rgba(201,164,92,0),#c9a45c)}
.gk-numrow i.r{background:linear-gradient(270deg,rgba(201,164,92,0),#c9a45c)}
.gk-num{font:600 54px/50px 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;color:#f3ead7;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.gk-host{width:96px;height:96px;object-fit:contain;display:block;margin:2px auto 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.65))}
.gk-say{font:700 17px/22px 'Gowun Batang',serif;color:#f3ead7;text-shadow:0 1px 4px rgba(0,0,0,.9);margin-top:4px}
.gk-sub{font-size:13px;line-height:18px;color:#d9ccb0;text-shadow:0 1px 4px rgba(0,0,0,.9)}
.gk-acts{position:absolute;left:0;right:0;top:608px;display:flex;align-items:center;justify-content:center;gap:18px}
.gk-btn{position:relative;height:54px;min-width:188px;padding:0 26px;display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid #c9a45c;border-radius:4px;background:linear-gradient(#f4ecda,#e4d8bd);color:#2a1f17;font:700 18px/1 'Gowun Batang',serif;letter-spacing:.1em;cursor:pointer;box-shadow:0 0 0 3px #1c1410,0 0 0 4px rgba(201,164,92,.6),0 10px 20px rgba(0,0,0,.45);transition:transform .15s,filter .15s}
.gk-btn::before{content:"";position:absolute;left:4px;top:4px;right:4px;bottom:4px;border:1px solid rgba(150,112,48,.55);border-radius:2px;pointer-events:none}
.gk-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.gk-btn:active{transform:translateY(1px)}
.gk-btn.ink{background:linear-gradient(#30241c,#1c1410);color:#efe6d2}
.gk-btn.ink::before{border-color:rgba(201,164,92,.5)}
.gk-btn svg{display:block;flex:none}
.gk-ghost{height:46px;min-width:92px;padding:0 20px;border:1px solid rgba(201,164,92,.65);border-radius:4px;background:rgba(18,12,8,.6);color:#efe6d2;font:500 14px/1 'IBM Plex Sans KR',sans-serif;letter-spacing:.06em;cursor:pointer}
.gk-ghost:hover{background:rgba(40,28,20,.8)}
.gk-coin{width:50px;height:50px;border-radius:50%;padding:0;border:1px solid #c9a45c;background:radial-gradient(circle at 50% 35%,#f6efdf,#e2d5b8);color:#2a1f17;font:600 27px/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;cursor:pointer;box-shadow:0 0 0 3px #1c1410,0 0 0 4px rgba(201,164,92,.55),0 6px 12px rgba(0,0,0,.45);transition:transform .15s}
.gk-coin:hover{transform:translateY(-2px)}
.gk-coin.sel{background:radial-gradient(circle at 50% 35%,#e6c987,#c9a45c);box-shadow:0 0 0 3px #1c1410,0 0 0 4px #ecd296,0 6px 12px rgba(0,0,0,.45)}
.gk-ask{position:absolute;left:0;right:0;top:588px;text-align:center;font:400 14px/18px 'Gowun Batang',serif;color:#d9ccb0;letter-spacing:.08em}
.gk-sep{display:block;width:1px;height:34px;background:rgba(201,164,92,.5);margin:0 6px}
.gk-scrim{position:absolute;left:0;right:0;bottom:0;height:270px;background:linear-gradient(rgba(10,6,4,0),rgba(10,6,4,.9) 58%);pointer-events:none;transition:opacity .4s}
.gk-hcap{position:absolute;left:36px;top:610px;font-size:11px;line-height:14px;letter-spacing:.24em;color:#d2b06a;transition:opacity .3s}
.gk-hd{position:absolute;left:0;top:0;width:112px;padding:0;border:0;background:none;color:#efe6d2;cursor:pointer;transform-origin:0 0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.gk-hd-face{position:relative;display:block;width:112px;height:112px;border-radius:50%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));transition:transform .18s}
.gk-hd:hover .gk-hd-face{transform:translateY(-6px)}
.gk-hd-face img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.gk-hd-face img.gk-ph,.gk-ph{position:absolute;left:10%;top:10%;width:80%;height:80%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #17100c}
.gk-hd-cap{display:block;margin-top:8px;font:400 14px/18px 'Gowun Batang',serif;letter-spacing:.12em;text-align:center;transition:opacity .3s}
.gk-cnt{position:absolute;right:20px;top:14px;display:flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;border-radius:999px;background:rgba(18,12,8,.66);border:1px solid rgba(201,164,92,.3)}
.gk-cnt span{font-size:11px;letter-spacing:.2em;color:#d2b06a;margin-right:6px}
.gk-cnt button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(201,164,92,0);background:none;color:#d9ccb0;font:600 20px/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;cursor:pointer}
.gk-dark{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(9,3,3,.62);pointer-events:none}
.gk-red{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 50% 41%,rgba(165,32,26,.46),rgba(165,32,26,0) 46%);pointer-events:none}

.pl-fly{position:absolute;left:0;top:0;width:112px;height:112px;transform-origin:0 0;z-index:5;pointer-events:none;filter:drop-shadow(0 14px 12px rgba(0,0,0,.55))}
.pl-arc{width:100%;height:100%;perspective:600px;animation:plArc .54s cubic-bezier(.3,0,.5,1) both}
.pl-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:plTurn .54s cubic-bezier(.4,0,.4,1) both}
.pl-f,.pl-b{position:absolute;left:0;top:0;width:100%;height:100%;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pl-f img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.pl-f img.gk-ph{left:10%;top:10%;width:80%;height:80%}
.pl-b{transform:rotateY(180deg)}
.pl-shade{position:absolute;left:-46px;top:-34px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.75),rgba(0,0,0,0) 68%);animation:plShade .5s ease-out both;pointer-events:none}
.pl-dust{position:absolute;left:-52px;top:-48px;width:104px;height:104px;border-radius:50%;border:1.5px solid rgba(236,210,150,.75);box-shadow:0 0 14px rgba(236,210,150,.45),inset 0 0 12px rgba(236,210,150,.3);animation:plDust .55s ease-out both;pointer-events:none}
.pl-puff{position:absolute;left:-60px;top:-56px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.5),rgba(255,244,214,0) 62%);animation:plPuff .45s ease-out both;pointer-events:none}
@keyframes plArc{0%{transform:translateY(0)}48%{transform:translateY(-58px)}100%{transform:translateY(0)}}
@keyframes plTurn{0%{transform:rotateY(0deg) rotateZ(0deg)}100%{transform:rotateY(180deg) rotateZ(-14deg)}}
@keyframes plLand{0%{transform:translateY(-7px) scale(1.07)}45%{transform:translateY(2px) scale(.965)}72%{transform:translateY(-1.5px) scale(1.012)}100%{transform:translateY(0) scale(1)}}
@keyframes plShade{0%{opacity:0;transform:scale(.7)}40%{opacity:.9;transform:scale(1.08)}100%{opacity:.55;transform:scale(1)}}
@keyframes plDust{0%{opacity:.9;transform:scale(.72)}100%{opacity:0;transform:scale(1.34)}}
@keyframes plPuff{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
</style>
</helmet>
<div class="gk">
  <div class="gk-vig"></div>
  <div class="gk-top"><b>갱스껄</b><i></i><span>3라운드</span></div>
  <sc-for list="{{seats}}" as="s" hint-placeholder-count="5">
    <div class="gk-seat" style="{{s.style}}">
      <sc-if value="{{s.turn}}" hint-placeholder-val="{{ false }}"><div class="gk-turn"></div></sc-if>
      <img class="gk-board" src="{{s.board}}" alt="" />
      <sc-if value="{{s.hasPile}}" hint-placeholder-val="{{ true }}">
        <div class="gk-pile" style="{{s.pileStyle}}">
          <sc-if value="{{s.landed}}" hint-placeholder-val="{{ false }}"><i class="pl-shade"></i></sc-if>
          <sc-for list="{{s.stack}}" as="d" hint-placeholder-count="2"><div class="gk-dk" style="{{d.style}}"><img src="{{d.src}}" style="{{d.imgStyle}}" alt="" /></div></sc-for>
          <i class="gk-hi" style="{{s.hiStyle}}"></i>
          <sc-if value="{{s.landed}}" hint-placeholder-val="{{ false }}"><i class="pl-puff"></i><i class="pl-dust"></i></sc-if>
          <div class="gk-n" style="{{s.badgeStyle}}"><span>{{s.pileLabel}}</span></div>
        </div>
      </sc-if>
    </div>
  </sc-for>
  <sc-for list="{{seats}}" as="s" hint-placeholder-count="5">
    <div class="gk-tag" style="{{s.tagStyle}}">
      <img class="gk-av" src="{{s.avatar}}" style="{{s.avStyle}}" alt="" />
      <div>
        <div class="gk-nm"><span>{{s.label}}</span><i class="gk-dot" style="{{s.dotStyle}}"></i></div>
        <div class="gk-meta"><i class="gk-pip" style="{{s.pip1}}"></i><i class="gk-pip" style="{{s.pip2}}"></i><svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#c8bca4" stroke-width="1.3" aria-hidden="true"><circle cx="6" cy="6" r="4.6"></circle><circle cx="6" cy="6" r="1.5"></circle></svg><span>{{s.discs}}</span></div>
      </div>
    </div>
  </sc-for>
  <div class="gk-mid">
    <div class="gk-cap">{{cap}}</div>
    <div class="gk-numrow"><i></i><span class="gk-num">{{num}}</span><i class="r"></i></div>
    <img class="gk-host" src="/_blob/a2c0e1d07fb93fdf99e90cd6a0a2d3be" alt="" />
    <div class="gk-say">{{say}}</div>
    <div class="gk-sub">{{sub}}</div>
  </div>
  <div class="gk-cnt"><span>인원</span>
    <sc-for list="{{counts}}" as="c" hint-placeholder-count="5"><button type="button" style="{{c.style}}" onClick="{{ c.set }}" aria-label="{{c.aria}}">{{c.n}}</button></sc-for>
  </div>
  <button type="button" class="gk-snd" style="position: absolute; right: 20px; top: 72px;" onClick="{{ toggleSnd }}" aria-label="{{sndAria}}"><sc-if value="{{sndOn}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18.2 6.5a7.8 7.8 0 0 1 0 11"></path></svg></sc-if><sc-if value="{{sndOff}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M16 9.5l5 5"></path><path d="M21 9.5l-5 5"></path></svg></sc-if></button>
  <sc-if value="{{isChoose}}" hint-placeholder-val="{{ true }}">
    <div class="gk-acts">
      <button type="button" class="gk-btn" onClick="{{ openHand }}"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 0.8 L9.2 5 L5 9.2 L0.8 5 Z"></path></svg><span>원판 내기</span><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 0.8 L9.2 5 L5 9.2 L0.8 5 Z"></path></svg></button>
      <button type="button" class="gk-btn ink" onClick="{{ openBid }}"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 0.8 L9.2 5 L5 9.2 L0.8 5 Z"></path></svg><span>도전</span><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 0.8 L9.2 5 L5 9.2 L0.8 5 Z"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{isBid}}" hint-placeholder-val="{{ false }}">
    <div class="gk-ask">꽃만 몇 개 뒤집겠습니까</div>
    <div class="gk-acts" style="top: 616px; gap: 14px;">
      <sc-for list="{{nums}}" as="b" hint-placeholder-count="7"><button type="button" class="gk-coin" onClick="{{ b.pick }}" aria-label="{{b.aria}}">{{b.n}}</button></sc-for>
      <i class="gk-sep"></i>
      <button type="button" class="gk-ghost" onClick="{{ cancel }}">취소</button>
    </div>
  </sc-if>
  <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
    <div class="gk-acts" style="top: 614px;"><button type="button" class="gk-ghost" onClick="{{ cancel }}">처음부터 다시 보기</button></div>
  </sc-if>
  <div class="gk-scrim" style="{{scrimStyle}}"></div>
  <div class="gk-hcap" style="{{hcapStyle}}">{{hcap}}</div>
  <sc-for list="{{hand}}" as="h" hint-placeholder-count="3">
    <button type="button" class="gk-hd" style="{{h.style}}" onClick="{{ h.pick }}" aria-label="{{h.aria}}">
      <span class="gk-hd-face"><img src="{{h.src}}" alt="" /><sc-if value="{{h.hasPhoto}}" hint-placeholder-val="{{ false }}"><img class="gk-ph" src="{{h.photo}}" alt="" /></sc-if></span>
      <span class="gk-hd-cap" style="{{h.capStyle}}">{{h.label}}</span>
    </button>
  </sc-for>
  <sc-if value="{{isPlay}}" hint-placeholder-val="{{ false }}">
    <button type="button" class="gk-ghost" style="{{cancelStyle}}" onClick="{{ cancel }}">취소</button>
  </sc-if>
  <sc-if value="{{isFly}}" hint-placeholder-val="{{ false }}">
    <div class="pl-fly" style="{{flyStyle}}">
      <div class="pl-arc">
        <div class="pl-in">
          <span class="pl-f"><img src="{{flySrc}}" alt="" /><sc-if value="{{flyHasPhoto}}" hint-placeholder-val="{{ false }}"><img class="gk-ph" src="{{flyPhoto}}" alt="" /></sc-if></span>
          <img class="pl-b" src="/_blob/d836973ee4412f6e5a8e9eb83effc300" alt="" />
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  state = { phase: 'choose', n: 5, hand: ['F', 'F', 'S'], played: 0, bid: 0, fly: null, snd: true };

  // ── 타이머: 전부 모아 두었다가 치울 때 한 번에 지운다
  later(fn, ms) {
    var self = this;
    if (!this._t) this._t = [];
    var id = setTimeout(function () { fn.call(self); }, ms);
    this._t.push(id);
    return id;
  }
  clearTimers() {
    var t = this._t || [];
    for (var i = 0; i < t.length; i++) clearTimeout(t[i]);
    this._t = [];
  }
  componentWillUnmount() {
    this.clearTimers();
    if (this._ac && this._ac.close) { try { this._ac.close(); } catch (e) {} }
    this._ac = null;
  }

  // ── 소리(WebAudio 합성). 첫 누름 때 만든다.
  ac(force) {
    if (!force && this.state && this.state.snd === false) return null;
    if (!this._ac) {
      var A = null;
      if (typeof AudioContext !== 'undefined') A = AudioContext;
      else if (typeof webkitAudioContext !== 'undefined') A = webkitAudioContext;
      if (!A) return null;
      try {
        this._ac = new A();
        this._out = this._ac.createGain();
        this._out.gain.value = 0.7;
        this._out.connect(this._ac.destination);
      } catch (e) { this._ac = null; return null; }
    }
    if (this._ac.state === 'suspended' && this._ac.resume) { try { this._ac.resume(); } catch (e) {} }
    return this._ac;
  }
  // 여러 음을 한꺼번에. opt = { to: 끝 음높이 배수, lp: 저역 통과(Hz), att: 올라오는 시간 }
  tone(freqs, dur, type, gain, delay, opt) {
    var ac = this.ac(); if (!ac) return;
    var o = opt || {}, t = ac.currentTime + (delay || 0) + 0.01, out = this._out;
    if (o.lp) {
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lp;
