<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  state = { phase: 'idle', need: 5, piles: [2, 2, 3, 1], row: [], act: null, next: 'F', fxk: 'A', snd: true };

  // ── 타이머: 전부 모아 두었다가 치울 때 한 번에 지운다
  later(fn, ms) {
    var self = this;
    if (!this._t) this._t = [];
    var id = setTimeout(function () { fn.call(self); }, ms);
    this._t.push(id);
    return id;
  }
  clearTimers() {
    var t = this._t || [];
    for (var i = 0; i < t.length; i++) clearTimeout(t[i]);
    this._t = [];
  }
  componentWillUnmount() {
    this.clearTimers();
    if (this._ac && this._ac.close) { try { this._ac.close(); } catch (e) {} }
    this._ac = null;
  }

  // ── 소리(WebAudio 합성). 첫 누름 때 만든다.
  ac(force) {
    if (!force && this.state && this.state.snd === false) return null;
    if (!this._ac) {
      var A = null;
      if (typeof AudioContext !== 'undefined') A = AudioContext;
      else if (typeof webkitAudioContext !== 'undefined') A = webkitAudioContext;
      if (!A) return null;
      try {
        this._ac = new A();
        this._out = this._ac.createGain();
        this._out.gain.value = 0.7;
        this._out.connect(this._ac.destination);
      } catch (e) { this._ac = null; return null; }
    }
    if (this._ac.state === 'suspended' && this._ac.resume) { try { this._ac.resume(); } catch (e) {} }
    return this._ac;
  }
  // 여러 음을 한꺼번에. opt = { to: 끝 음높이 배수, lp: 저역 통과(Hz), att: 올라오는 시간 }
  tone(freqs, dur, type, gain, delay, opt) {
    var ac = this.ac(); if (!ac) return;
    var o = opt || {}, t = ac.currentTime + (delay || 0) + 0.01, out = this._out;
    if (o.lp) {
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.lp;
      lp.connect(this._out); out = lp;
    }
    for (var i = 0; i < freqs.length; i++) {
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqs[i], t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqs[i] * o.to), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + (o.att || 0.008));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(out);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
  }
  // 걸러 낸 잡음 한 번
  noise(dur, gain, delay, freq, kind) {
    var ac = this.ac(); if (!ac) return;
    var t = ac.currentTime + (delay || 0) + 0.01;
    var len = Math.max(1, Math.floor(ac.sampleRate * dur));
    var buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = kind || 'bandpass'; f.frequency.value = freq || 1800;
    var g = ac.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this._out);
    src.start(t); src.stop(t + dur + 0.02);
  }
  // 놓기 "탁": 짧은 잡음 + 떨어지는 저음
  sfxTak() {
    this.noise(0.05, 0.3, 0, 1900, 'bandpass');
    this.tone([150], 0.1, 'sine', 0.4, 0, { to: 0.45 });
    this.tone([420], 0.04, 'triangle', 0.08, 0);
  }
  // 꽃 단계음 1~5: 한 장마다 음이 오르고(도 레 미 솔 라) 화음 겹이 하나씩 늘어난다
  sfxFlower(n, d) {
    var steps = [0, 2, 4, 7, 9, 12, 14, 16];
    var f = 523.25 * Math.pow(2, steps[Math.max(1, Math.min(n, 8)) - 1] / 12);
    this.tone([f], 0.55, 'sine', 0.2, d);                 // 마림바 몸통
    this.tone([f * 4], 0.14, 'sine', 0.05, d);            // 두드리는 맑은 끝
    this.tone([f * 2], 0.3, 'triangle', 0.04, d);
    if (n >= 2) this.tone([f * 1.5], 0.5, 'sine', 0.1, d + 0.07);          // + 5도
    if (n >= 3) this.tone([f * 2], 0.6, 'sine', 0.09, d + 0.14);           // + 옥타브
    if (n >= 4) { this.tone([f * 2.5], 0.7, 'sine', 0.07, d + 0.21); this.noise(0.35, 0.03, d + 0.05, 7000, 'highpass'); }   // + 3도, 반짝임
    if (n >= 5) { this.tone([f * 3, f * 4], 0.9, 'triangle', 0.045, d + 0.28); this.tone([f / 2], 0.9, 'sine', 0.12, d); }    // + 높은 겹, 낮은 받침
  }
  // 성공 피날레: 큰 장조 화음 + 위로 흩어지는 음 + 반짝임
  sfxWin() {
    this.tone([261.63, 329.63, 392, 523.25, 659.25, 783.99], 2.4, 'sine', 0.085, 0, { att: 0.02 });
    this.tone([130.81], 2.4, 'triangle', 0.13, 0, { att: 0.02 });
    var a = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568, 2093];
    for (var i = 0; i < a.length; i++) this.tone([a[i]], 0.9, 'sine', 0.09, 0.08 + i * 0.07);
    this.noise(1.4, 0.035, 0.1, 6500, 'highpass');
  }
  // 해골 애태우기: 심장 박동 한 번(쿵-쿵)
  sfxBeat(d) {
    this.tone([62], 0.2, 'sine', 0.6, d, { to: 0.6 });
    this.tone([124], 0.1, 'triangle', 0.1, d, { to: 0.5 });
    this.tone([54], 0.24, 'sine', 0.42, d + 0.16, { to: 0.6 });
    this.tone([108], 0.1, 'triangle', 0.06, d + 0.16, { to: 0.5 });
    this.noise(0.06, 0.07, d, 180, 'lowpass');
  }
  // 해골 등장: 낮은 쿵 + 디튠된 불협 화음(증4도) + 아래로 일그러지는 소리
  sfxDoom() {
    this.tone([72], 1.6, 'sine', 0.8, 0, { to: 0.38 });
    this.tone([110], 0.5, 'triangle', 0.22, 0, { to: 0.45 });
    this.noise(0.7, 0.5, 0, 320, 'lowpass');
    this.tone([55, 58.6, 77.8], 1.9, 'sawtooth', 0.11, 0.02, { lp: 520, att: 0.03 });
    this.tone([233.1, 246.9], 1.5, 'sawtooth', 0.045, 0.05, { lp: 1400, to: 0.5, att: 0.05 });
  }
  toggleSound() {
    var on = !(this.state && this.state.snd === false);
    this.setState({ snd: !on });
    if (!on) this.ac(true);

        petals.push({ rot: 'transform: rotate(' + Math.round(i * 360 / np + (i % 2 ? 9 : -7)) + 'deg) scale(' + spread + ')',
          anim: 'animation: fxPet' + (i % 3) + k + ' ' + (0.7 + (i % 4) * 0.08) + 's cubic-bezier(.15,.7,.3,1) ' + ((i % 5) * 0.03) + 's both' });
      }
      for (var j = 0; j < ns; j++) {
        sparks.push({ rot: 'transform: rotate(' + Math.round(j * 360 / ns + 17) + 'deg) scale(' + (spread * (j % 2 ? 1.15 : 0.85)) + ')',
          anim: 'animation: fxSpk' + k + ' ' + (0.6 + (j % 3) * 0.1) + 's ease-out ' + (0.05 + (j % 4) * 0.04) + 's both' });
      }
    };
    if (hasBurst) {
      burstStyle = 'left: ' + cx + 'px; top: ' + cy + 'px';
      mk(Math.round(5 + lvl * 3), Math.round(2 + lvl * 2), Math.round(130 + lvl * 38), +(0.85 + lvl * 0.09).toFixed(2), k);
    }
    if (win) {
      hasBurst = true;
      burstStyle = 'left: ' + G.cx + 'px; top: ' + ROWY + 'px';
      mk(26, 18, 620, 2.5, k === 'A' ? 'B' : 'A');   // 직전 꽃 효과와 다른 이름 → 처음부터 다시 돈다
    }

    // 상대 더미 누르기(고르는 동안에만)
    var picks = [];
    if (phase === 'pick') {
      for (var i2 = 1; i2 < P.length; i2++) {
        (function (i) {
          if (st.piles[i] <= 0) return;
          var q = pos[i];
          picks.push({
            style: 'left: ' + q.x + 'px; top: ' + (q.y - (st.piles[i] - 1) * STEP / 2) + 'px',
            aria: P[i].name + ' 님 더미 뒤집기',
            flip: function () { var nx = self.state.next; self.ac(); self.flipTop(i, P[i].color, nx === 'S' ? 'S' : 'F', nx === 'T'); }
          });
        })(i2);
      }
    }

    var left = rem === 1 ? '마지막 한 장' : '앞으로 ' + rem + '장';
    var say = me.name + ' 님이 ' + NEED + '개에 도전했습니다', sub = '시작을 누르면 내 원판부터 뒤집습니다';
    if (phase === 'auto') { say = '내 원판부터 뒤집습니다'; sub = count > 0 ? '꽃 ' + count + '장 · ' + left : '맨 위부터 한 장씩'; }
    if (phase === 'pick') { say = '상대 더미를 눌러 뒤집으세요'; sub = '꽃 ' + count + '장 · ' + left; }
    if (phase === 'busy' && act) { say = P[act.seat].name + ' 님의 원판'; sub = stage.indexOf('tease') === 0 ? '…' : (stage === 'relief' ? '휴 — 꽃입니다' : '꽃 ' + count + '장 · ' + left); }

    var segOn = 'border-color: #c9a45c; color: #f3ead7; background: rgba(201,164,92,.2)';
    var sndOn = st.snd !== false;
    var gold = heat / 5;
    var needs = [2, 5, 9].map(function (n) {
      return { label: '' + n, aria: '도전 숫자 ' + n, style: n === NEED ? segOn : '', set: function () { self.setNeed(n); } };
    });
    return {
      rootStyle: lost ? 'animation: fxShake' + k + ' .5s cubic-bezier(.3,.6,.3,1) both' : '',
      seats: seats, slots: slots, picks: picks,
      count: count, need: NEED,
      numStyle: 'display: inline-block; animation: fxBump' + (count % 2 ? 'A' : 'B') + ' .42s ease-out both; text-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 ' + Math.round(gold * 26) + 'px rgba(240,200,110,' + (gold * 0.8).toFixed(2) + ')',
      say: say, sub: sub, sayStyle: 'opacity: ' + (win || lost ? 0 : 1),
      hasAct: hasAct, cardStyle: cardStyle, turnStyle: turnStyle, tremStyle: tremStyle,
      cardBack: cardBack, cardFace: cardFace, cardHasPhoto: cardHasPhoto, cardPhoto: cardPhoto,
      vigStyle: 'opacity: ' + vig + (stage === 'relief' ? '; transition: opacity .22s ease-out' : ''),   // 꽃이면 어둠이 확 걷힌다
      isEdge: edge, hasWarm: stage === 'relief',
      warmStyle: 'left: ' + cx + 'px; top: ' + cy + 'px; animation: fxWarm' + k + ' .95s ease-out both',
      hasBurst: hasBurst, burstStyle: burstStyle, glowStyle: glowStyle, ringStyle: ringStyle, petals: petals, sparks: sparks,
      isLost: lost, isWin: win, isIdle: phase === 'idle', isOver: win || lost,
      darkStyle: 'animation: fxIn' + k + ' .22s ease-out both',
      redStyle: 'left: ' + dcx + 'px; top: ' + dcy + 'px; animation: fxIn' + k + ' .5s ease-out both',
      auraStyle: 'left: ' + dcx + 'px; top: ' + dcy + 'px; animation: fxIn' + k + ' .35s ease-out .08s both',
      demonStyle: 'left: ' + dcx + 'px; top: ' + (dcy - 72) + 'px; animation: fxRise' + k + ' .9s cubic-bezier(.2,.7,.3,1) .12s both',
      rimStyle: 'animation: fxIn' + k + ' .25s ease-out both',
      doomTxtStyle: 'animation: fxSlam' + k + ' .45s cubic-bezier(.2,.8,.3,1) .32s both',
      doomLine: owner >= 0 ? P[owner].name + ' 님의 해골 · ' + me.name + ' 님 도전 실패' : '',
      winTxtStyle: 'animation: fxSlam' + k + ' .5s cubic-bezier(.2,.8,.3,1) .25s both',
      winLine: me.name + ' 님이 꽃 ' + NEED + '장을 모두 뒤집었습니다 · 1점',
      start: function () { self.begin(); },
      restart: function () { self.begin(); },
      needs: needs,
      segF: st.next === 'S' || st.next === 'T' ? '' : segOn,
      segT: st.next === 'T' ? segOn : '',
      segS: st.next === 'S' ? 'border-color: rgba(214,84,70,.95); color: #f3c4b8; background: rgba(170,40,30,.28)' : '',
      setF: function () { self.setState({ next: 'F' }); },
      setT: function () { self.setState({ next: 'T' }); },
      setS: function () { self.setState({ next: 'S' }); },
      sndOn: sndOn, sndOff: !sndOn, sndAria: sndOn ? '소리 끄기' : '소리 켜기',
      toggleSnd: function () { self.toggleSound(); }
    };
  }
}
</script>
</body>
</html>
